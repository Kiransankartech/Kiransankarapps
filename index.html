function syncSettingsUI(){
  var light=isLight();
  var ts=document.getElementById('settingsThemeSwitch');
  var tl=document.getElementById('settingsThemeLabel');
  if(ts)ts.classList.toggle('on',light);
  if(tl)tl.textContent='Currently: '+(light?'Light':'Dark');
  var as=document.getElementById('settingsAiSwitch');
  if(as)as.classList.toggle('on',aiEnabled);
  var es=document.getElementById('settingsEasySwitch');
  if(es)es.classList.toggle('on',easyMode);
  var eggs=document.getElementById('settingsEggsSwitch');
  if(eggs)eggs.classList.toggle('on',easterEggs);
}
function settingsToggleTheme(){ toggleTheme(); syncSettingsUI(); }
function settingsToggleAI(){ aiEnabled=!aiEnabled; syncSettingsUI(); applyAISettings(); schedulePrefsSave(); }
function applyAISettings(){
  var fab=document.getElementById('ksChatFab');
  var panel=document.getElementById('ksChatPanel');
  if(!fab)return;
  if(aiEnabled){ fab.style.display='flex'; }
  else{ fab.style.display='none'; if(panel)panel.classList.remove('open'); chatOpen=false; }
}
function setFabCorner(corner){
  fabCorner=corner; fabCustomPos=null;
  var btns=document.querySelectorAll('#posGrid .pos-btn');
  for(var i=0;i<btns.length;i++)btns[i].classList.toggle('active',btns[i].dataset.pos===corner);
  applyFabPosition();
  schedulePrefsSave();
}
function applyFabPosition(){
  var fab=document.getElementById('ksChatFab');
  var panel=document.getElementById('ksChatPanel');
  if(!fab)return;
  fab.style.left='';fab.style.top='';fab.style.right='';fab.style.bottom='';
  if(fabCustomPos){ fab.style.left=fabCustomPos.left+'px'; fab.style.top=fabCustomPos.top+'px'; }
  else{
    if(fabCorner==='br'){fab.style.right='20px';fab.style.bottom='24px';}
    else if(fabCorner==='bl'){fab.style.left='20px';fab.style.bottom='24px';}
    else if(fabCorner==='tr'){fab.style.right='20px';fab.style.top='24px';}
    else if(fabCorner==='tl'){fab.style.left='20px';fab.style.top='24px';}
  }
  if(panel){
    panel.style.right='';panel.style.left='';panel.style.bottom='';panel.style.top='';
    var r=fab.getBoundingClientRect();
    var openUp=r.top>window.innerHeight/2;
    var openLeft=r.left>window.innerWidth/2;
    if(openUp) panel.style.bottom=(window.innerHeight-r.top+10)+'px'; else panel.style.top=(r.bottom+10)+'px';
    if(openLeft) panel.style.right=(window.innerWidth-r.right)+'px'; else panel.style.left=r.left+'px';
  }
}
function makeFabDraggable(){
  var fab=document.getElementById('ksChatFab');
  if(!fab)return;
  fab.classList.add('ks-draggable');
  var dragging=false,moved=false,startX,startY,startLeft,startTop;
  fab.addEventListener('pointerdown',function(e){
    dragging=true;moved=false;
    var r=fab.getBoundingClientRect();
    startX=e.clientX;startY=e.clientY;startLeft=r.left;startTop=r.top;
    try{fab.setPointerCapture(e.pointerId);}catch(err){}
    fab.classList.add('ks-dragging');
  });
  fab.addEventListener('pointermove',function(e){
    if(!dragging)return;
    var dx=e.clientX-startX,dy=e.clientY-startY;
    if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;
    if(!moved)return;
    var w=fab.offsetWidth,h=fab.offsetHeight;
    var left=Math.min(Math.max(0,startLeft+dx),window.innerWidth-w);
    var top=Math.min(Math.max(0,startTop+dy),window.innerHeight-h);
    fab.style.right='';fab.style.bottom='';
    fab.style.left=left+'px';fab.style.top=top+'px';
    fabCustomPos={left:left,top:top};
  });
  function endDrag(){
    if(!dragging)return;
    dragging=false;
    fab.classList.remove('ks-dragging');
    if(moved){applyFabPosition();schedulePrefsSave();}
  }
  fab.addEventListener('pointerup',endDrag);
  fab.addEventListener('pointercancel',endDrag);
  fab.onclick=function(){ if(!moved) toggleChat(); };
}
new MutationObserver(function(){syncSettingsUI();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ═══════════════════════ BACKGROUND TIMER PILL ═══════════════════════
   Shows a small draggable pill (Dynamic-Island style) whenever the
   Stopwatch and/or Timer has an active session and you're on a
   different page. If BOTH are running at once, the pill holds two
   pages you scroll through vertically — swipe up/down to see the
   other one, tap a page to jump to that tool, tap its ✕ to dismiss. */
function injectTimerPill(){

/* Tapping ✕ on a still-running item just hides the pill — the timer/stopwatch

function dismissPillTimer(kind){
  if(kind==='cd'){
    if(cdAlarmPlaying){ stopCdAlarm();cdFinished=false; }
    else{ cdPillHidden=true; }
  }else if(kind==='sw'){

  }

function getKsAudioCtx(){
  if(!ksAudioCtx) ksAudioCtx=new (window.AudioContext||window.webkitAudioContext)();
  return ksAudioCtx;
}
function playPillBeep(){
  try{
    var ctx=getKsAudioCtx();
    if(ctx.state==='suspended') ctx.resume();
    var t=ctx.currentTime;
    [[880,t],[1040,t+.42]].forEach(function(pair){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=pair[0];
      g.gain.setValueAtTime(0.0001,pair[1]);
      g.gain.exponentialRampToValueAtTime(0.22,pair[1]+.01);
      g.gain.exponentialRampToValueAtTime(0.0001,pair[1]+.33);
      o.connect(g);g.connect(ctx.destination);
      o.start(pair[1]);o.stop(pair[1]+.35);
    });
  }catch(err){}
}
function startCdAlarm(){
  if(cdAlarmPlaying)return;
  cdAlarmPlaying=true;

function updateTimerPill(){
  var pill=document.getElementById('ksTimerPill');
  var pageCd=document.getElementById('ksPillPageCd');
  var pageSw=document.getElementById('ksPillPageSw');
  var labelCd=document.getElementById('ksPillLabelCd');
  var labelSw=document.getElementById('ksPillLabelSw');
  var restartCd=document.getElementById('ksPillRestartCd');
  if(!pill||!pageCd||!pageSw)return;
  // Catch a countdown reaching zero while we're away from its page —
  // cdTick only runs while the countdown page itself is open.
  if(cdRunning&&cdEnd<=Date.now()){
    clearInterval(cdInterval);cdRunning=false;cdTotal=0;
    cdMarkFinished();
  }
  var cdShow=cdAlarmPlaying||((cdRunning||cdTotal>0)&&curPage!=='countdown'&&!cdPillHidden);
  var swShow=(swRunning||swElapsed>0)&&curPage!=='stopwatch'&&!swPillHidden;

  if(cdShow){
    pageCd.style.display='flex';
    pageCd.classList.toggle('finished',cdAlarmPlaying);
    if(restartCd) restartCd.style.display=cdAlarmPlaying?'inline-block':'none';
    if(cdAlarmPlaying) labelCd.textContent="⏰ Time's up";
    else{ var rem=cdRunning?Math.max(0,Math.round((cdEnd-Date.now())/1000)):cdTotal; labelCd.textContent=cdFmt(rem); }
  }else{ pageCd.style.display='none'; }

  if(swShow){
    pageSw.style.display='flex';
    var total=swRunning?swElapsed+(Date.now()-swStart):swElapsed;
    labelSw.textContent=swFmt(total).slice(0,5);

}
function makePillDraggable(handle,pill){
  var dragging=false,startX,startY,startLeft,startTop;
  handle.addEventListener('pointerdown',function(e){
    dragging=true;
    var r=pill.getBoundingClientRect();
    startX=e.clientX;startY=e.clientY;startLeft=r.left;startTop=r.top;
    try{handle.setPointerCapture(e.pointerId);}catch(err){}
    pill.classList.add('ks-dragging');
  });
  handle.addEventListener('pointermove',function(e){
    if(!dragging)return;
    var dx=e.clientX-startX,dy=e.clientY-startY;
    var w=pill.offsetWidth,h=pill.offsetHeight;
    var left=Math.min(Math.max(0,startLeft+dx),window.innerWidth-w);
    var top=Math.min(Math.max(0,startTop+dy),window.innerHeight-h);
    pill.style.transform='none';
    pill.style.left=left+'px';pill.style.top=top+'px';
  });
  function endDrag(){
    if(!dragging)return;
    dragging=false;
    pill.classList.remove('ks-dragging');
  }
  handle.addEventListener('pointerup',endDrag);
  handle.addEventListener('pointercancel',endDrag);
}

/* ═══════════════════════════════════════════════════════════════
   HANDWRITING FONT CREATOR (added)
   Turn your own handwriting into a font you can type with.
   100% offline — no AI, no server, no uploads. Everything below
   is namespaced with the "hwfc" / "HWFC" prefix so it never
   collides with the rest of KS Tech.
   ═══════════════════════════════════════════════════════════════ */

/* ── 1. LANGUAGE PACKS ──
   Architecture supports adding more languages later: just add a new
   key here with uppercase/lowercase/optional arrays. English is the
   only pack shipped today; the rest of the app already tells users
   "More languages coming soon." */
const HWFC_LANGUAGES = {
  en: {
    name: 'English',
    uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),
    lowercase: 'abcdefghijklmnopqrstuvwxyz'.split(''),
    optional: {

      punctuation: ['.', ',', '!', '?', ':', ';', "'", '"', '(', ')', '[', ']', '{', '}', '-', '_', '/', '\\', '@', '#', '&', '*', '+', '='],
      math: ['+', '−', '×', '÷', '=', '%', '√', '^', '<', '>', '≤', '≥', '≈', '∞'],
      currency: ['₹', '$', '€', '£', '¥', '₩', '₽', '¢']
    }
  }
};
const HWFC_CATS = ['numbers', 'punctuation', 'math', 'currency'];
const HWFC_CAT_LABELS = { numbers: 'Numbers', punctuation: 'Punctuation', math: 'Mathematics', currency: 'Currency' };
const HWFC_CAT_ICONS = { numbers: '🔢', punctuation: '❗', math: '➗', currency: '💲' };

/* ── 2. DRAWING CANVAS GEOMETRY ──
   Every letter is captured on a fixed internal resolution square so
   that the baseline guide sits at the exact same relative spot for
   every single character. That fixed, shared geometry is what lets
   font-generation later work out a real baseline/scale for the font
   without any AI — it's just consistent geometry. */
const HWFC_CANVAS_SIZE = 480;
const HWFC_TOP_GUIDE_Y = Math.round(HWFC_CANVAS_SIZE * 0.14);
const HWFC_BASELINE_Y = Math.round(HWFC_CANVAS_SIZE * 0.72);
const HWFC_TARGET_CAP_UNITS = 64; /* font "design units" a capital letter is normalized to */
const HWFC_FONT_PX = { small: 0.40, medium: 0.56, large: 0.78 }; /* px per design-unit, by font-size setting */

/* ── 3. STATE ──
   hwfcState is the single source of truth for this feature. It is
   loaded from storage on first entry and re-saved (debounced) any
   time it changes. Shape:
   {
     view, lang, collectMode, collectIndex, optCatIdx, optCharIdx,
     glyphs: { [char]: { raw: dataURL, crop, scale/baseline metrics } },
     optionalStatus: { numbers:'pending'|'done'|'skipped', ... },
     settings: { fontSize, letterSpacing, wordSpacing, lineHeight, themeMode },
     typedText, fontGenerated
   } */
let hwfcState = null;
let hwfcUseIDB = false;
let hwfcDBHandle = null;
let hwfcDBReady = null; /* promise */
var hwfcSaveTimer = null; /* var (not let) — go() below can reference this before this line runs */
let hwfcStrokes = [];   /* strokes for the CURRENT letter being drawn */
let hwfcRedoStrokes = [];
let hwfcActivePointerId = null;
let hwfcCurrentStroke = null;
let hwfcTypingHistory = [];
let hwfcTypingHistoryIdx = -1;
var hwfcTypingHistoryTimer = null; /* var (not let) — same reason as hwfcSaveTimer above */
let hwfcPreviewRAF = null;
let hwfcInkCtx = null;
let hwfcTouched = false;
let hwfcOptCharIdx = null;
let hwfcResizeHandlerRef = null;
let hwfcMeasureCanvasEl = null;
let hwfcRenderMultiplier = 1;

function hwfcDefaultState(){
  return {
    view: 'home',
    lang: 'en',
    collectMode: 'upper',
    collectIndex: 0,
    optCatIdx: 0,
    glyphs: {},
    optionalStatus: { numbers: 'pending', punctuation: 'pending', math: 'pending', currency: 'pending' },
    settings: { fontSize: 'medium', letterSpacing: 0, wordSpacing: 0, lineHeight: 1.4, themeMode: 'system' },
    typedText: '',
    fontGenerated: false
  };
}

/* ── 4. STORAGE — IndexedDB, falling back to localStorage ──
   IndexedDB is used because the captured handwriting (dozens of
   small transparent PNGs) can comfortably exceed what's safe to
   keep in localStorage. If IndexedDB isn't available for any reason
   the whole thing still works, just backed by localStorage instead. */
function hwfcDbOpen(){
  if (hwfcDBReady) return hwfcDBReady;
  hwfcDBReady = new Promise((resolve) => {
    if (!('indexedDB' in window)) { hwfcUseIDB = false; resolve(null); return; }
    try{
      const req = indexedDB.open('hwfcFontDB', 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv', { keyPath: 'key' });
      };
      req.onsuccess = () => { hwfcDBHandle = req.result; hwfcUseIDB = true; resolve(hwfcDBHandle); };
      req.onerror = () => { hwfcUseIDB = false; resolve(null); };
    }catch(e){ hwfcUseIDB = false; resolve(null); }
  });
  return hwfcDBReady;
}
function hwfcDbGet(key){
  return hwfcDbOpen().then((db) => {
    if (!db) {
      try{ const raw = localStorage.getItem('hwfc_' + key); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
    }
    return new Promise((resolve) => {
      try{
        const tx = db.transaction('kv', 'readonly');
        const req = tx.objectStore('kv').get(key);
        req.onsuccess = () => resolve(req.result ? req.result.value : null);
        req.onerror = () => resolve(null);
      }catch(e){ resolve(null); }
    });
  });
}
function hwfcDbSet(key, value){
  return hwfcDbOpen().then((db) => {
    if (!db) {
      try{ localStorage.setItem('hwfc_' + key, JSON.stringify(value)); }catch(e){ /* quota or unavailable — silently skip, non-fatal */ }
      return;
    }
    return new Promise((resolve) => {
      try{
        const tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put({ key: key, value: value });
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      }catch(e){ resolve(); }
    });
  });
}
function hwfcScheduleSave(){
  clearTimeout(hwfcSaveTimer);
  hwfcSaveTimer = setTimeout(() => {
    if (!hwfcState) return;
    hwfcDbSet('profile', hwfcState);
  }, 350);
}
function hwfcInit(cb){
  if (hwfcState){ cb(); return; }
  hwfcDbGet('profile').then((saved) => {
    hwfcState = saved && typeof saved === 'object' ? Object.assign(hwfcDefaultState(), saved) : hwfcDefaultState();
    /* merge nested objects properly instead of letting a partial saved shape wipe defaults */
    if (saved){
      hwfcState.optionalStatus = Object.assign({ numbers:'pending', punctuation:'pending', math:'pending', currency:'pending' }, saved.optionalStatus || {});
      hwfcState.settings = Object.assign({ fontSize:'medium', letterSpacing:0, wordSpacing:0, lineHeight:1.4, themeMode:'system' }, saved.settings || {});
      hwfcState.glyphs = saved.glyphs || {};
    }
    cb();
  });
}

/* ── 6. DRAWING ENGINE ──
   Two stacked canvases: a static "guide" layer (baseline + margin,
   purely visual, redrawn once) and a transparent "ink" layer the
   user actually draws on and which is the only one ever exported.
   Strokes are stored as arrays of {x,y,p} points in the ink canvas's
   own coordinate space so undo/redo can fully replay them. */
function hwfcPointFromEvent(e, canvasEl){
  const rect = canvasEl.getBoundingClientRect();
  const scaleX = canvasEl.width / rect.width;
  const scaleY = canvasEl.height / rect.height;
  return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY, p: (e.pressure && e.pressure > 0) ? e.pressure : 0.5 };
}
function hwfcDrawGuides(ctx){
  ctx.save();
  ctx.strokeStyle = 'rgba(127,137,168,0.35)';
  ctx.setLineDash([10, 8]);
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, HWFC_BASELINE_Y); ctx.lineTo(HWFC_CANVAS_SIZE, HWFC_BASELINE_Y); ctx.stroke();
  ctx.strokeStyle = 'rgba(127,137,168,0.18)';
  ctx.beginPath(); ctx.moveTo(0, HWFC_TOP_GUIDE_Y); ctx.lineTo(HWFC_CANVAS_SIZE, HWFC_TOP_GUIDE_Y); ctx.stroke();
  ctx.restore();
}
function hwfcRedrawInk(ctx, strokes){
  ctx.clearRect(0, 0, HWFC_CANVAS_SIZE, HWFC_CANVAS_SIZE);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--text') || '#111';
  strokes.forEach((stroke) => {
    if (stroke.length < 2){
      if (stroke.length === 1){ /* a tap/dot — draw a small filled circle */
        const p = stroke[0];
        ctx.beginPath(); ctx.fillStyle = ctx.strokeStyle;
        ctx.arc(p.x, p.y, Math.max(3, 7 * p.p), 0, Math.PI * 2); ctx.fill();
      }
      return;
    }
    for (let i = 1; i < stroke.length; i++){
      const p0 = stroke[i - 1], p1 = stroke[i];
      const mid = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
      ctx.lineWidth = Math.max(2.5, 11 * ((p0.p + p1.p) / 2));
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.quadraticCurveTo(p0.x, p0.y, mid.x, mid.y);
      ctx.stroke();
    }
  });
}
function hwfcSetupCanvas(guideEl, inkEl, onStrokeEnd){
  const gctx = guideEl.getContext('2d');
  const ictx = inkEl.getContext('2d');
  hwfcDrawGuides(gctx);
  hwfcStrokes = []; hwfcRedoStrokes = []; hwfcCurrentStroke = null; hwfcActivePointerId = null;
  hwfcRedrawInk(ictx, hwfcStrokes);

  function down(e){
    if (hwfcActivePointerId !== null) return;
    hwfcActivePointerId = e.pointerId;
    inkEl.setPointerCapture(e.pointerId);
    hwfcCurrentStroke = [hwfcPointFromEvent(e, inkEl)];
    hwfcRedoStrokes = [];
    e.preventDefault();
  }
  function move(e){
    if (e.pointerId !== hwfcActivePointerId || !hwfcCurrentStroke) return;
    hwfcCurrentStroke.push(hwfcPointFromEvent(e, inkEl));
    hwfcRedrawInk(ictx, hwfcStrokes.concat([hwfcCurrentStroke]));
    e.preventDefault();
  }
  function up(e){
    if (e.pointerId !== hwfcActivePointerId) return;
    if (hwfcCurrentStroke && hwfcCurrentStroke.length) hwfcStrokes.push(hwfcCurrentStroke);
    hwfcCurrentStroke = null;
    hwfcActivePointerId = null;
    hwfcRedrawInk(ictx, hwfcStrokes);
    if (typeof onStrokeEnd === 'function') onStrokeEnd();
  }
  inkEl.addEventListener('pointerdown', down);
  inkEl.addEventListener('pointermove', move);
  inkEl.addEventListener('pointerup', up);
  inkEl.addEventListener('pointercancel', up);
  inkEl.addEventListener('pointerleave', (e) => { if (e.pointerId === hwfcActivePointerId) up(e); });
  return ictx;
}
function hwfcUndoStroke(ictx){
  if (!hwfcStrokes.length) return;
  hwfcRedoStrokes.push(hwfcStrokes.pop());
  hwfcRedrawInk(ictx, hwfcStrokes);
}
function hwfcRedoStroke(ictx){
  if (!hwfcRedoStrokes.length) return;
  hwfcStrokes.push(hwfcRedoStrokes.pop());
  hwfcRedrawInk(ictx, hwfcStrokes);
}
function hwfcClearStrokes(ictx){
  hwfcStrokes = []; hwfcRedoStrokes = [];
  hwfcRedrawInk(ictx, hwfcStrokes);
}

/* ── 7. GLYPH SAVING ──
   Called when the user moves off a letter. Saves the ink canvas's
   current bitmap as this character's raw glyph (or removes it if
   the user left the letter blank). */
function hwfcSaveCurrentGlyph(ch, inkEl){
  /* Only touch stored state if the user actually interacted with this
     letter during this visit — otherwise simply paging through to look
     at Review would silently wipe out already-drawn letters. */
  if (!hwfcTouched) return;
  if (!hwfcStrokes.length){
    delete hwfcState.glyphs[ch];
  }else{
    hwfcState.glyphs[ch] = { raw: inkEl.toDataURL('image/png') };
  }
  hwfcScheduleSave();
}
/* Mounts the two-layer canvas for whichever character is currently being
   collected (required or optional). If a glyph was already saved for this
   character, its bitmap is shown as a starting preview — the instant the
   user begins a new stroke, the live stroke-redraw naturally replaces it. */
function hwfcMountCollectCanvas(ch){
  const guideEl = document.getElementById('hwfcGuide');
  const inkEl = document.getElementById('hwfcInk');
  hwfcInkCtx = hwfcSetupCanvas(guideEl, inkEl, () => { hwfcTouched = true; });
  hwfcTouched = false;
  const existing = hwfcState.glyphs[ch];
  if (existing && existing.raw){
    const img = new Image();
    img.onload = () => { if (!hwfcTouched && !hwfcStrokes.length && hwfcInkCtx) hwfcInkCtx.drawImage(img, 0, 0); };
    img.src = existing.raw;
  }
}
function hwfcTUndo(){ hwfcUndoStroke(hwfcInkCtx); hwfcTouched = true; }
function hwfcTRedo(){ hwfcRedoStroke(hwfcInkCtx); hwfcTouched = true; }
function hwfcTClear(){ hwfcClearStrokes(hwfcInkCtx); hwfcTouched = true; }

/* ── 8. FONT GENERATION ──
   No AI — pure image-processing math:
     1. Find each glyph's tight non-transparent bounding box (crop).
     2. Every glyph was drawn against the SAME fixed baseline guide,
        so (baselineY - cropTop) is a real, comparable "baseline
        offset" for that glyph.
     3. One global scale factor (based on the median cap-height of
        the 26 uppercase letters) is applied to every glyph so
        relative proportions between letters stay natural instead of
        each letter being independently stretched to match. */
function hwfcLoadImage(dataURL){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = dataURL;
  });
}
function hwfcCropBounds(img){
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, c.width, c.height).data;
  let minX = c.width, minY = c.height, maxX = -1, maxY = -1;
  for (let y = 0; y < c.height; y++){
    for (let x = 0; x < c.width; x++){
      const alpha = data[(y * c.width + x) * 4 + 3];
      if (alpha > 10){
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return null; /* fully blank */
  return { minX, minY, maxX, maxY, canvas: c };
}
function hwfcCroppedDataURL(bounds){
  const w = bounds.maxX - bounds.minX + 1, h = bounds.maxY - bounds.minY + 1;
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  out.getContext('2d').drawImage(bounds.canvas, bounds.minX, bounds.minY, w, h, 0, 0, w, h);
  return out.toDataURL('image/png');
}
async function hwfcGenerateFont(onProgress){
  const chars = Object.keys(hwfcState.glyphs);
  const bounds = {};
  for (let i = 0; i < chars.length; i++){
    const ch = chars[i];
    const img = await hwfcLoadImage(hwfcState.glyphs[ch].raw);
    const b = hwfcCropBounds(img);
    if (b) bounds[ch] = b;
    if (typeof onProgress === 'function') onProgress(i + 1, chars.length);
  }
  /* median cap-height from whichever uppercase letters were actually drawn */
  const upperHeights = HWFC_LANGUAGES[hwfcState.lang].uppercase
    .filter((ch) => bounds[ch])
    .map((ch) => bounds[ch].maxY - bounds[ch].minY + 1)
    .sort((a, b) => a - b);
  const medianCap = upperHeights.length ? upperHeights[Math.floor(upperHeights.length / 2)] : 1;
  const globalScale = HWFC_TARGET_CAP_UNITS / Math.max(1, medianCap);

  Object.keys(bounds).forEach((ch) => {
    const b = bounds[ch];
    const cropW = b.maxX - b.minX + 1, cropH = b.maxY - b.minY + 1;
    const baselineFromTop = HWFC_BASELINE_Y - b.minY;
    hwfcState.glyphs[ch].processed = {
      img: hwfcCroppedDataURL(b),
      w: cropW * globalScale,
      h: cropH * globalScale,
      baseline: baselineFromTop * globalScale
    };
  });
  hwfcState.fontGenerated = true;
  await hwfcDbSet('profile', hwfcState);
}

/* ── 9. TEXT LAYOUT + RENDER ENGINE ──
   Shared by the live preview canvas and the hi-res PNG export, so
   what you see is exactly what gets downloaded. Missing characters
   fall back to a plain system font at a matching size instead of a
   blank box. */
function hwfcUnitPx(){ return HWFC_FONT_PX[hwfcState.settings.fontSize] || HWFC_FONT_PX.medium; }
function hwfcGlyphAdvance(ch, unitPx, fallbackCtx){
  const g = hwfcState.glyphs[ch] && hwfcState.glyphs[ch].processed;
  const letterSpacing = hwfcState.settings.letterSpacing || 0;
  if (g) return g.w * unitPx + letterSpacing;
  if (ch === ' ') return HWFC_TARGET_CAP_UNITS * 0.5 * unitPx + (hwfcState.settings.wordSpacing || 0) + letterSpacing;
  fallbackCtx.font = Math.round(HWFC_TARGET_CAP_UNITS * unitPx) + 'px system-ui, sans-serif';
  return fallbackCtx.measureText(ch).width + letterSpacing;
}
function hwfcLayoutText(text, maxWidth, measureCtx){
  const unitPx = hwfcUnitPx();
  const paragraphs = text.split('\n');
  const lines = []; /* each: { chars:[{ch,x}], width } */
  paragraphs.forEach((para) => {
    const words = para.length ? para.split(' ') : [''];
    let line = { chars: [], width: 0 };
    words.forEach((word, wi) => {
      const wordChars = wi < words.length - 1 ? word + ' ' : word;
      let wordWidth = 0;
      const advances = [];
      for (const ch of wordChars){
        const adv = hwfcGlyphAdvance(ch, unitPx, measureCtx);
        advances.push(adv); wordWidth += adv;
      }
      if (line.width + wordWidth > maxWidth && line.chars.length){
        lines.push(line);
        line = { chars: [], width: 0 };
      }
      let cursor = line.width;
      let ci = 0;
      for (const ch of wordChars){
        if (cursor + advances[ci] > maxWidth && line.chars.length){
          lines.push(line);
          line = { chars: [], width: 0 };
          cursor = 0;
        }
        line.chars.push({ ch, x: cursor, adv: advances[ci] });
        cursor += advances[ci]; ci++;
      }
      line.width = cursor;
    });
    lines.push(line);
  });
  return lines;
}
function hwfcPreloadGlyphImages(){
  const jobs = [];
  Object.keys(hwfcState.glyphs).forEach((ch) => {
    const g = hwfcState.glyphs[ch].processed;
    if (g && g.img && !g._imgEl){
      const img = new Image();
      jobs.push(new Promise((resolve) => { img.onload = resolve; img.onerror = resolve; img.src = g.img; }));
      g._imgEl = img;
    }
  });
  return Promise.all(jobs);
}
function hwfcRenderLinesToCanvas(canvasEl, lines, opts){
  const unitPx = hwfcUnitPx();
  const ctx = canvasEl.getContext('2d');
  const linePitch = HWFC_TARGET_CAP_UNITS * unitPx * (hwfcState.settings.lineHeight || 1.4);
  const topPad = linePitch * 0.9;
  canvasEl.width = opts.width;
  canvasEl.height = Math.max(opts.minHeight || 0, topPad + lines.length * linePitch + linePitch * 0.5);
  ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = opts.ink || '#1a1a2e';
  lines.forEach((line, li) => {
    const baseY = topPad + li * linePitch;
    line.chars.forEach((c) => {
      const g = hwfcState.glyphs[c.ch] && hwfcState.glyphs[c.ch].processed;
      if (g && g.img && g._imgEl && g._imgEl.complete && g._imgEl.naturalWidth){
        const dw = g.w * unitPx, dh = g.h * unitPx;
        try{ ctx.drawImage(g._imgEl, c.x, baseY - g.baseline * unitPx, dw, dh); }catch(e){}
      }else if (c.ch !== ' '){
        ctx.font = Math.round(HWFC_TARGET_CAP_UNITS * unitPx) + 'px system-ui, sans-serif';
        ctx.fillText(c.ch, c.x, baseY);
      }
    });
  });
  return canvasEl.height;
}

/* ── 10. LANGUAGE / PROGRESS HELPERS ── */
function hwfcLangData(){ return HWFC_LANGUAGES[hwfcState.lang] || HWFC_LANGUAGES.en; }
function hwfcRequiredList(mode){ return mode === 'upper' ? hwfcLangData().uppercase : hwfcLangData().lowercase; }
function hwfcRequiredDoneCount(){
  const all = hwfcLangData().uppercase.concat(hwfcLangData().lowercase);
  return all.filter((ch) => hwfcState.glyphs[ch]).length;
}
function hwfcCatChars(cat){ return hwfcLangData().optional[cat]; }
function hwfcCatPending(cat){ return hwfcCatChars(cat).filter((ch) => !hwfcState.glyphs[ch]); }
function hwfcCatStatusLabel(cat){
  const status = hwfcState.optionalStatus[cat];
  const total = hwfcCatChars(cat).length;
  const pendingCount = hwfcCatPending(cat).length;
  if (pendingCount === 0) return 'Completed';
  if (status === 'skipped') return 'Skipped';
  if (pendingCount < total) return `Partly done (${total - pendingCount}/${total})`;
  return 'Not started';
}

/* ── 11. CONFIRM MODAL (reuses the site's existing .modal-overlay look) ── */

/* ── 12. TOP-LEVEL ROUTER FOR THIS FEATURE ── */
function renderHandwritingFont(){
  appEl.innerHTML = "<div class='page-wrap'><p style='text-align:center;color:var(--muted);padding:60px 0'>Loading your handwriting…</p></div>";
  hwfcInit(() => { hwfcApplyThemeMode(); hwfcRenderCurrentView(); });
}
function hwfcRenderCurrentView(){
  if (curPage !== 'handwritingfont' || !hwfcState) return; /* guard against a stale async callback firing after the user navigated away */
  const v = hwfcState.view;
  if (v === 'collect') hwfcRenderCollect();
  else if (v === 'optional') hwfcRenderOptional();
  else if (v === 'review') hwfcRenderReview();
  else if (v === 'typing') hwfcRenderTyping();
  else hwfcRenderHome();
}
function hwfcSetView(view, extra){
  hwfcState.view = view;
  if (extra) Object.assign(hwfcState, extra);
  hwfcOptCharIdx = null;
  hwfcScheduleSave();
  hwfcRenderCurrentView();
}
function hwfcApplyThemeMode(){
  const mode = (hwfcState.settings || {}).themeMode || 'system';
  let effective = mode;
  if (mode === 'system') effective = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', effective);
}

/* ── 13. HOME / LANGUAGE VIEW ── */
function hwfcRenderHome(){
  const doneCount = hwfcRequiredDoneCount();
  const hasProgress = doneCount > 0 || Object.keys(hwfcState.glyphs).length > 0;

        <option value='en' selected>English</option>
      </select>
      <p class='hwfc-hint'>More languages coming soon.</p>
      ${hasProgress ? `<div class='hwfc-progress-note'>You have handwriting saved — ${doneCount}/52 required letters done${hwfcState.fontGenerated ? ', and your font is ready.' : '.'}</div>` : ''}
      <button class='btn btn-primary' style='width:100%;margin-top:18px' onclick='hwfcHomeContinue()'>${hwfcState.fontGenerated ? 'Continue' : (hasProgress ? 'Resume' : 'Get Started')}</button>

    </div>

  </div>`;
}
function hwfcHomeContinue(){
  if (hwfcState.fontGenerated){ hwfcSetView('typing'); return; }
  const upper = hwfcLangData().uppercase, lower = hwfcLangData().lowercase;
  const missingUpperIdx = upper.findIndex((ch) => !hwfcState.glyphs[ch]);
  if (missingUpperIdx !== -1){ hwfcSetView('collect', { collectMode: 'upper', collectIndex: missingUpperIdx }); return; }
  const missingLowerIdx = lower.findIndex((ch) => !hwfcState.glyphs[ch]);
  if (missingLowerIdx !== -1){ hwfcSetView('collect', { collectMode: 'lower', collectIndex: missingLowerIdx }); return; }
  const catIdx = HWFC_CATS.findIndex((cat) => hwfcState.optionalStatus[cat] === 'pending' && hwfcCatPending(cat).length > 0);
  if (catIdx !== -1){ hwfcSetView('optional', { optCatIdx: catIdx }); return; }
  hwfcSetView('review');
}
function hwfcConfirmResetAll(){
  hwfcOpenConfirmModal('Start a brand new font?', "This will erase every letter you've drawn and any font you've generated. This can't be undone.", 'Erase & start over', () => {
    hwfcState = hwfcDefaultState();
    hwfcDbSet('profile', hwfcState);
    hwfcRenderCurrentView();
    hwfcToast('Starting fresh.');
  });
}

function hwfcCollectNext(){
  const ch = hwfcRequiredList(hwfcState.collectMode)[hwfcState.collectIndex];

  if (hwfcState.collectMode === 'upper' && hwfcState.collectIndex === 25){

  }
  if (hwfcState.collectMode === 'lower' && hwfcState.collectIndex === 25){

}
function hwfcCollectPrev(){
  const ch = hwfcRequiredList(hwfcState.collectMode)[hwfcState.collectIndex];

  if (hwfcState.collectIndex > 0){ hwfcSetView('collect', { collectIndex: hwfcState.collectIndex - 1 }); return; }

  hwfcSetView('home');
}
function hwfcExitCollect(){
  if (hwfcState.view === 'optional'){
    const cat = HWFC_CATS[hwfcState.optCatIdx];
    const ch = cat ? hwfcCatPending(cat)[hwfcOptCharIdx] : null;
    if (ch) hwfcSaveCurrentGlyph(ch, document.getElementById('hwfcInk'));
  }else{
    const ch = hwfcRequiredList(hwfcState.collectMode)[hwfcState.collectIndex];
    hwfcSaveCurrentGlyph(ch, document.getElementById('hwfcInk'));
  }
  hwfcSetView('home');
}

/* ── 15. OPTIONAL CHARACTERS (Numbers / Punctuation / Math / Currency) ── */

  const cat = HWFC_CATS[hwfcState.optCatIdx];

}

    </div>
    <div class='hwfc-tools'>
      <button class='hwfc-tool-btn' onclick='hwfcTUndo()'>↶ Undo</button>

    </div>
  </div>`;

}
function hwfcOptCharPrev(){
  const cat = HWFC_CATS[hwfcState.optCatIdx];
  const pending = hwfcCatPending(cat);
  const ch = pending[hwfcOptCharIdx];
  hwfcSaveCurrentGlyph(ch, document.getElementById('hwfcInk'));
  if (hwfcOptCharIdx > 0) hwfcOptCharIdx--; else hwfcOptCharIdx = null;
  hwfcRenderCurrentView();
}
function hwfcOptCharNext(){
  const cat = HWFC_CATS[hwfcState.optCatIdx];
  const pending = hwfcCatPending(cat);
  const ch = pending[hwfcOptCharIdx];
  hwfcSaveCurrentGlyph(ch, document.getElementById('hwfcInk'));
  const newPending = hwfcCatPending(cat);
  if (newPending.length === 0){
    hwfcState.optionalStatus[cat] = 'done'; hwfcScheduleSave();
    hwfcOptCharIdx = null; hwfcState.optCatIdx++;
    hwfcRenderCurrentView(); return;
  }
  const stillPending = newPending.indexOf(ch) !== -1;
  hwfcOptCharIdx = stillPending ? Math.min(hwfcOptCharIdx + 1, newPending.length - 1) : Math.min(hwfcOptCharIdx, newPending.length - 1);
  hwfcRenderCurrentView();
}
function hwfcOptCharSkip(){
  const cat = HWFC_CATS[hwfcState.optCatIdx];
  const pending = hwfcCatPending(cat);
  if (hwfcOptCharIdx < pending.length - 1){ hwfcOptCharIdx++; }
  else { hwfcOptCharIdx = null; hwfcState.optCatIdx++; }
  hwfcRenderCurrentView();
}
function hwfcSkipCategory(){
  const cat = HWFC_CATS[hwfcState.optCatIdx];
  hwfcState.optionalStatus[cat] = hwfcCatPending(cat).length > 0 ? 'skipped' : 'done';
  hwfcScheduleSave();
  hwfcOptCharIdx = null;
  hwfcState.optCatIdx++;
  hwfcRenderCurrentView();
}
function hwfcOptionalBack(){
  if (hwfcOptCharIdx !== null && hwfcOptCharIdx !== undefined){ hwfcOptCharIdx = null; hwfcRenderCurrentView(); return; }
  if (hwfcState.optCatIdx > 0){ hwfcState.optCatIdx--; hwfcRenderCurrentView(); return; }
  hwfcSetView('collect', { collectMode: 'lower', collectIndex: 25 });
}

function hwfcRefreshPreview(){

function hwfcDownloadPng(){

function hwfcExportProfile(){

function hwfcHandleImportFile(e){
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if (!parsed || typeof parsed !== 'object' || !parsed.glyphs) throw new Error('Not a recognizable handwriting profile');
      const fresh = hwfcDefaultState();
      hwfcState = Object.assign(fresh, parsed);
      hwfcState.settings = Object.assign(fresh.settings, parsed.settings || {});
      hwfcState.optionalStatus = Object.assign(fresh.optionalStatus, parsed.optionalStatus || {});
      hwfcDbSet('profile', hwfcState).then(() => {
        hwfcToast('Profile imported.');
        document.querySelectorAll('.modal-overlay').forEach((m) => m.remove());
        hwfcSetView(hwfcState.fontGenerated ? 'typing' : 'review');
      });
    }catch(err){
      hwfcToast('That file could not be read as a handwriting profile.');
    }
  };
  reader.readAsText(file);
}

   UX-only gate: everything here is convenience/navigation. The actual
   authorization boundary is Firestore's isAdmin() check on every read/write
   for adminConfig/security, appConfig/features, announcements, and
   inboxMessages — this code never grants access on its own, it just hides
   controls that would fail server-side anyway for a non-admin. */
var ADMIN_UNLOCK_KEY='ksAdminUnlocked_v1';
var ADMIN_IDLE_MS=30*60*1000; // re-lock after 30 min of no admin activity
var adminView='flags';        // 'flags' | 'announcements' | 'inbox'

function adminUnsubAll(){

}

function adminIsSessionUnlocked(){
  var raw;
  try{ raw=sessionStorage.getItem(ADMIN_UNLOCK_KEY); }catch(e){ return false; }
  if(!raw) return false;
  try{
    var obj=JSON.parse(raw);
    if(!obj||!obj.ts) return false;
    if(Date.now()-obj.ts>ADMIN_IDLE_MS){ sessionStorage.removeItem(ADMIN_UNLOCK_KEY); return false; }
    obj.ts=Date.now(); sessionStorage.setItem(ADMIN_UNLOCK_KEY, JSON.stringify(obj)); // refresh idle timer on activity
    return true;
  }catch(e){ return false; }
}
function adminMarkUnlocked(){
  try{ sessionStorage.setItem(ADMIN_UNLOCK_KEY, JSON.stringify({ts:Date.now()})); }catch(e){}
}
function adminLock(){
  try{ sessionStorage.removeItem(ADMIN_UNLOCK_KEY); }catch(e){}
  adminUnsubAll();

function adminPinBackspace(){

function sha256Hex(str){
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  });
}
function adminPinSubmit(){
  if(adminPinBusy) return;
  if(adminPinEntry.length<4){ adminPinErr='PIN must be at least 4 digits.'; adminPinDraw(); return; }
  adminPinBusy=true; adminPinErr=null; adminPinDraw();
  sha256Hex(adminPinEntry).then(function(hash){
    if(adminPinMode==='setup'){
      return window.KSFirebase.adminSetPin(hash).then(function(){
        adminPinBusy=false; adminMarkUnlocked(); renderAdmin();
      });
    }else{
      return window.KSFirebase.adminGetSecurity().then(function(snap){
        var data=(snap&&snap.exists&&snap.exists())?snap.data():null;
        adminPinBusy=false;
        if(data && data.pinHash===hash){ adminMarkUnlocked(); renderAdmin(); }
        else{ adminPinEntry=''; adminPinErr='Incorrect PIN.'; adminPinDraw(); }
      });
    }
  }).catch(function(err){
    adminPinBusy=false; adminPinEntry='';
    adminPinErr=ksFriendlyAuthError?ksFriendlyAuthError(err):'Something went wrong. Please try again.';
    adminPinDraw();
  });
}
function adminChangePinPrompt(){

    return window.KSFirebase.adminSetPin(hash);

}

// Filters the App Features rows by label text as the admin types. Hides a
// whole group heading when every row inside it is filtered out, so search
// results don't leave empty "Games" / "Health tools" headers floating around.
function adminFilterFeatures(query){
  var q=(query||'').toLowerCase().trim();
  var groups=document.querySelectorAll('#adminFeatureGroups .admin-flag-group');
  var anyVisible=false;
  groups.forEach(function(group){
    var rows=group.querySelectorAll('.admin-flag-row');
    var groupHasMatch=false;
    rows.forEach(function(row){
      var match=!q||row.dataset.name.indexOf(q)!==-1;
      row.style.display=match?'':'none';
      if(match){ groupHasMatch=true; anyVisible=true; }
    });
    group.style.display=groupHasMatch?'':'none';
  });
  var noMatch=document.getElementById('adminFeatureNoMatch');
  if(noMatch) noMatch.style.display=anyVisible?'none':'block';
}
function adminToggleCatalogFlag(key,val){

}
// Emergency Site Pause (added) — a deliberately separate, extra-confirmed
// path from adminToggleCatalogFlag: this one flag takes the whole app
// offline for every non-admin visitor, so turning it ON always requires an
// explicit confirmation. Turning it OFF does not — that's the "undo".
function adminToggleMaintenance(checkbox){
  var checked=checkbox.checked;
  if(checked && !confirm('This takes the ENTIRE site offline for every visitor right now — they will see a maintenance page instead of the app. You will still have full access as admin. Continue?')){
    checkbox.checked=false;
    return;
  }
  window.KSFirebase.setFeatureFlag('app_maintenance',checked).then(function(){
    var label=document.querySelector('.admin-maintenance-label');
    if(label) label.textContent=checked?'🔴 SITE IS PAUSED':'🟢 Site is live';
  }).catch(function(err){
    alert('Could not update: '+(err&&err.message?err.message:err));
    checkbox.checked=!checked;
  });
}

// Live validation as the admin types — normalizes to a safe snake_case key,
// rejects anything that doesn't match ADMIN_FLAG_KEY_RE or already exists,
// and keeps the submit button disabled until the key is actually valid. This
// replaces the old behavior of silently stripping bad characters with no
// feedback, which is how gibberish/partial keys were getting created.
function adminValidateFlagKeyInput(){
  var inp=document.getElementById('adminNewFlagKey');
  var help=document.getElementById('adminFlagKeyHelp');
  var btn=document.getElementById('adminAddFlagBtn');
  if(!inp||!help||!btn) return false;
  var raw=inp.value;
  var norm=raw.trim().toLowerCase().replace(/\s+/g,'_');
  var valid=ADMIN_FLAG_KEY_RE.test(norm);
  var dup=valid && Object.prototype.hasOwnProperty.call(adminFeatureFlags,norm);
  inp.classList.toggle('err', raw.length>0 && !valid);
  if(!raw.length){
    help.textContent='Lowercase letters, numbers, and underscores only — must start with a letter (2–40 characters).';
    help.style.color='var(--sub)';
  }else if(!valid){
    help.textContent='Invalid key — use lowercase letters, numbers, and underscores, starting with a letter.';
    help.style.color='#FF5A5A';
  }else if(dup){
    help.textContent='A flag named "'+norm+'" already exists.';
    help.style.color='#FF5A5A';
  }else{
    help.textContent='Will be added as: '+norm;
    help.style.color='#22C58B';
  }
  btn.disabled=!(valid && !dup);
  return valid && !dup;
}
function adminToggleFlag(keyEnc,val){
  window.KSFirebase.setFeatureFlag(decodeURIComponent(keyEnc),val).catch(function(err){
    alert('Could not update flag: '+(err&&err.message?err.message:err));
  });
}
function adminDeleteFlag(keyEnc){
  var key=decodeURIComponent(keyEnc);
  if(!confirm('Delete flag "'+key+'"? This cannot be undone.')) return;
  window.KSFirebase.deleteFeatureFlag(key).catch(function(err){
    alert('Could not delete flag: '+(err&&err.message?err.message:err));
  });
}
function adminAddFlag(){
  var inp=document.getElementById('adminNewFlagKey');
  if(!inp) return false;
  if(!adminValidateFlagKeyInput()) return false; // re-validates + refreshes the helper text/disabled state
  var key=inp.value.trim().toLowerCase().replace(/\s+/g,'_');
  var btn=document.getElementById('adminAddFlagBtn');
  if(btn) btn.disabled=true;
  window.KSFirebase.setFeatureFlag(key,false).then(function(){
    inp.value='';
    adminValidateFlagKeyInput();
  }).catch(function(err){
    alert('Could not add flag: '+(err&&err.message?err.message:err));
    if(btn) btn.disabled=false;
  });
  return false;
}

/* ═══════════════════════ PUBLIC ANNOUNCEMENT BANNER (added) ═══════════════════════
   Public, read-only, real-time. Uses the same window.KSFirebase.subscribeAnnouncements
   the admin dashboard uses (announcements/{id} allows "read: if true" for everyone in
   the rules, signed in or not) — so any create/edit/hide/delete an admin makes shows
   up here instantly via onSnapshot, no page refresh needed. This listener is started
   once at page load and runs for the whole session, independent of which page/tab of
   the app is open and independent of sign-in state. */
var announcementList=[];               // raw docs from the live listener
var announcementListenerStarted=false;
var announcementExpandedIds={};        // id -> true once "Show more" is clicked on a long one
var announcementStackExpanded=false;   // true once "Show N more announcements" is clicked
var ANNOUNCEMENT_VISIBLE_CAP=3;        // stacked banners shown before collapsing behind a toggle
var ANNOUNCEMENT_CLAMP_LEN=140;        // body length above which "Show more" appears

function announcementDismissedIds(){
  try{ return JSON.parse(localStorage.getItem('ksDismissedAnnouncements')||'[]'); }catch(e){ return []; }
}
function announcementDismiss(id){
  var ids=announcementDismissedIds();
  if(ids.indexOf(id)===-1){ ids.push(id); if(ids.length>50) ids=ids.slice(-50); }
  try{ localStorage.setItem('ksDismissedAnnouncements', JSON.stringify(ids)); }catch(e){}
  renderAnnouncementStack();
}
function announcementToggleExpand(id){
  announcementExpandedIds[id]=!announcementExpandedIds[id];
  renderAnnouncementStack();
}
function startAnnouncementsListener(){
  if(announcementListenerStarted) return;
  if(!window.KSFirebase||!window.KSFirebase.subscribeAnnouncements){ setTimeout(startAnnouncementsListener,300); return; }
  announcementListenerStarted=true;
  window.KSFirebase.subscribeAnnouncements(function(list,err){
    if(err){ return; } // public banner fails quietly — a read hiccup here shouldn't block the rest of the site
    announcementList=list||[];
    renderAnnouncementStack();
  });
}
function renderAnnouncementStack(){
  var el=document.getElementById('announcementStack');
  if(!el) return;
  var dismissed=announcementDismissedIds();
  // "active" mirrors the admin dashboard's own Live/Hidden toggle: active!==false
  var active=(announcementList||[]).filter(function(a){ return a.active!==false && dismissed.indexOf(a.id)===-1; });
  if(!active.length){ el.innerHTML=''; return; }
  var visible=announcementStackExpanded?active:active.slice(0,ANNOUNCEMENT_VISIBLE_CAP);
  var extra=active.length-visible.length;
  var html=visible.map(announcementBarHTML).join('');
  if(extra>0){
    html+='<button class="announcement-more-stack-btn" onclick="announcementStackExpanded=true;renderAnnouncementStack();">Show '+extra+' more announcement'+(extra===1?'':'s')+'</button>';
  }else if(announcementStackExpanded && active.length>ANNOUNCEMENT_VISIBLE_CAP){
    html+='<button class="announcement-more-stack-btn" onclick="announcementStackExpanded=false;renderAnnouncementStack();">Show less</button>';
  }
  el.innerHTML=html;
}
function announcementBarHTML(a){
  var when=(typeof communityTimeAgo==='function' && a.createdAt)?communityTimeAgo(a.createdAt):'';
  var expanded=!!announcementExpandedIds[a.id];
  var rawBody=a.body||'';
  var isLong=rawBody.length>ANNOUNCEMENT_CLAMP_LEN;
  return '<div class="announcement-bar">'
    +'<div class="announcement-icon">📣</div>'
    +'<div class="announcement-body">'
      +'<div class="announcement-title">'+escapeHTML(a.title||'Announcement')+(when?'<span class="announcement-time">'+escapeHTML(when)+'</span>':'')+'</div>'
      +'<div class="announcement-text'+(isLong&&!expanded?' clamped':'')+'">'+escapeHTML(rawBody)+'</div>'
      +(isLong?'<button class="announcement-more" onclick="announcementToggleExpand(\''+a.id+'\')">'+(expanded?'Show less':'Show more')+'</button>':'')
    +'</div>'
    +'<button class="announcement-dismiss" onclick="announcementDismiss(\''+a.id+'\')" title="Dismiss" aria-label="Dismiss">✕</button>'
  +'</div>';
}

applyFabPosition();

/* Optional synonym expansion — a query word on the left also
   pulls in results matched by the words on the right, at a
   slightly reduced score. */
const SYNONYMS = {
  "dark":     ["night","black","theme"],
  "light":    ["day","bright","theme"],
  "money":    ["price","cost","payment","loan","emi"],
  "doc":      ["document","pdf","file"],
  "pic":      ["picture","photo","image","jpg"],
  "acct":     ["account","settings"],
  "colour":   ["color","palette"],
  "colr":     ["color","palette"]
};

const RECENTS_KEY = "ks_universal_search_recents_v1";
const MAX_RECENTS = 10;
const MAX_RESULTS = 10;

/* Static "popular" list — shown when the search box is empty. */
const POPULAR_IDS = ["bmi","age","calchub","pdf-merge","settings","games"];

/* ============================================================
   3. UTILITIES
   ============================================================ */
function normalize(str){
  return (str || "")
    .toString()
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function levenshtein(a, b, maxDist){
  if (a === b) return 0;
  const al = a.length, bl = b.length;
  if (Math.abs(al - bl) > maxDist) return maxDist + 1;
  let prev = new Array(bl + 1);
  for (let j = 0; j <= bl; j++) prev[j] = j;
  for (let i = 1; i <= al; i++){
    const cur = [i];
    let rowMin = cur[0];
    for (let j = 1; j <= bl; j++){
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + cost);
      if (cur[j] < rowMin) rowMin = cur[j];
    }
    if (rowMin > maxDist) return maxDist + 1;
    prev = cur;
  }
  return prev[bl];
}

function isSubsequence(needle, hay){
  let i = 0;
  for (let j = 0; j < hay.length && i < needle.length; j++){
    if (hay[j] === needle[i]) i++;
  }
  return i === needle.length;
}

function debounce(fn, ms){
  return function(...args){
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => fn.apply(null, args), ms);
  };
}

/* ============================================================
   4. SCORING
   ============================================================ */
const FIELD_WEIGHT = { title: 12, alias: 9, keyword: 6, description: 3, category: 2, hidden: 1 };

function fieldScore(fieldNormalized, query, weight){
  if (!fieldNormalized) return 0;
  if (fieldNormalized === query) return 100 * weight;
  if (fieldNormalized.startsWith(query)) return 65 * weight;

  const words = fieldNormalized.split(/[\s\-_/]+/);
  if (words.some(w => w.startsWith(query))) return 48 * weight;

  if (fieldNormalized.includes(query)) return 30 * weight;

  const maxDist = query.length <= 4 ? 1 : 2;
  for (const w of words){
    if (Math.abs(w.length - query.length) <= maxDist && levenshtein(w, query, maxDist) <= maxDist){
      return 20 * weight;
    }
  }

  if (query.length >= 2 && isSubsequence(query, fieldNormalized)){
    return 8 * weight;
  }
  return 0;
}

function findHighlightRanges(fieldNormalized, fieldOriginal, query){
  if (!fieldNormalized || !query) return [];
  const idx = fieldNormalized.indexOf(query);
  if (idx === -1) return [];
  return [[idx, idx + query.length]];
}

function scoreItem(item, query, expandedTerms){
  const qN = query;
  let titleRanges = [];
  let descRanges = [];

  const titleN = normalize(item.title);
  const descN = normalize(item.description);
  const catN = normalize(item.category);

  const sTitle = fieldScore(titleN, qN, FIELD_WEIGHT.title);
  const sDesc  = fieldScore(descN, qN, FIELD_WEIGHT.description);
  const sCat   = fieldScore(catN, qN, FIELD_WEIGHT.category);

  let sAlias = 0, sKeyword = 0, sHidden = 0;
  for (const a of (item.aliases || [])) sAlias = Math.max(sAlias, fieldScore(normalize(a), qN, FIELD_WEIGHT.alias));
  for (const k of (item.keywords || [])) sKeyword = Math.max(sKeyword, fieldScore(normalize(k), qN, FIELD_WEIGHT.keyword));
  for (const h of (item.hidden || [])) sHidden = Math.max(sHidden, fieldScore(normalize(h), qN, FIELD_WEIGHT.hidden));

  let best = sTitle + sDesc*0.3 + sCat*0.2 + sAlias*0.5 + sKeyword*0.5 + sHidden*0.3;

  for (const term of expandedTerms){
    const tN = normalize(term);
    let s = 0;
    for (const k of (item.keywords || [])) s = Math.max(s, fieldScore(normalize(k), tN, FIELD_WEIGHT.keyword));
    for (const a of (item.aliases || [])) s = Math.max(s, fieldScore(normalize(a), tN, FIELD_WEIGHT.alias));
    for (const h of (item.hidden || [])) s = Math.max(s, fieldScore(normalize(h), tN, FIELD_WEIGHT.hidden));
    best += s * 0.35;
  }

  if (best <= 0) return null;

  titleRanges = findHighlightRanges(titleN, item.title, qN);
  descRanges = findHighlightRanges(descN, item.description, qN);

  return { item, score: best, titleRanges, descRanges };
}

function expandQuery(query){
  const out = [];
  for (const key in SYNONYMS){
    if (query.includes(key)) out.push(...SYNONYMS[key]);
  }
  return out;
}

function search(query){
  const q = normalize(query).trim();
  if (!q) return [];
  const expanded = expandQuery(q);
  const scored = [];
  for (const item of itemsIndex.values()){
    const r = scoreItem(item, q, expanded);
    if (r) scored.push(r);
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, MAX_RESULTS);
}

/* ============================================================
   5. RECENT SEARCHES
   ============================================================ */
function loadRecents(){
  try {
    const raw = localStorage.getItem(RECENTS_KEY);
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  } catch (e) { return []; }
}
function saveRecents(list){
  try { localStorage.setItem(RECENTS_KEY, JSON.stringify(list.slice(0, MAX_RECENTS))); }
  catch (e) { /* storage unavailable — fail silently */ }
}
function pushRecent(item){
  let list = loadRecents().filter(r => r.id !== item.id);
  list.unshift({ id: item.id, title: item.title, icon: item.icon, category: item.category });
  saveRecents(list);
}
function removeRecent(id){
  saveRecents(loadRecents().filter(r => r.id !== id));
}

/* ============================================================
   6. RENDERING
   ============================================================ */
function highlightText(text, ranges){
  if (!ranges || !ranges.length) return escapeHtml(text);
  let out = "";
  let last = 0;
  for (const [start, end] of ranges){
    out += escapeHtml(text.slice(last, start));
    out += "<mark>" + escapeHtml(text.slice(start, end)) + "</mark>";
    last = end;
  }
  out += escapeHtml(text.slice(last));
  return out;
}
function escapeHtml(s){
  return (s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function renderResultsList(results){
  els.resultsWrap.innerHTML = "";
  els.empty.hidden = true;
  currentResults = results.map(r => r.item || r);
  activeIndex = currentResults.length ? 0 : -1;

  if (!results.length){
    els.resultsWrap.innerHTML = "";
    els.highlight.style.opacity = "0";
    return;
  }

  const list = document.createElement("ul");
  list.className = "usp-list";
  list.id = "uspList";
  list.setAttribute("role", "listbox");

  results.forEach((r, i) => {
    const item = r.item || r;
    const li = document.createElement("li");
    li.className = "usp-item";
    li.style.setProperty("--usp-i", i);
    li.id = "usp-opt-" + item.id;
    li.setAttribute("role", "option");
    li.setAttribute("aria-selected", i === 0 ? "true" : "false");
    li.dataset.id = item.id;

    const titleHtml = r.titleRanges ? highlightText(item.title, r.titleRanges) : escapeHtml(item.title);
    const descHtml = r.descRanges ? highlightText(item.description, r.descRanges) : escapeHtml(item.description);

    li.innerHTML =
      '<div class="usp-item-icon" aria-hidden="true">' + item.icon + '</div>' +
      '<div class="usp-item-body">' +
        '<div class="usp-item-title-row">' +
          '<div class="usp-item-title">' + titleHtml + '</div>' +
        '</div>' +
        '<div class="usp-item-desc">' + descHtml + '</div>' +
      '</div>' +
      '<span class="usp-badge">' + escapeHtml(item.category) + '</span>';

    li.addEventListener("click", (e) => {
      spawnRipple(li, e);
      activateOrPreview(item);
    });
    li.addEventListener("mousemove", () => setActiveIndex(i, false));

    list.appendChild(li);
  });

  els.resultsWrap.appendChild(list);
  els.input.setAttribute("aria-controls", "uspList");
  moveHighlightTo(0, false);
}

function renderBrowseState(){
  els.empty.hidden = true;
  els.resultsWrap.innerHTML = "";
  els.highlight.style.opacity = "0";

  const recents = loadRecents();
  const frag = document.createDocumentFragment();

  if (recents.length){
    const label = document.createElement("div");
    label.className = "usp-section-label";
    label.textContent = "Recent Searches";
    frag.appendChild(label);

    const row = document.createElement("div");
    row.className = "usp-chip-row";
    recents.forEach(r => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "usp-chip";
      chip.innerHTML = '<span aria-hidden="true">' + r.icon + '</span><span>' + escapeHtml(r.title) + '</span><span class="usp-chip-x" data-recent-remove="' + r.id + '">✕</span>';
      chip.addEventListener("click", (e) => {
        if (e.target.matches("[data-recent-remove]")){
          e.stopPropagation();
          removeRecent(r.id);
          renderBrowseState();
          return;
        }
        const item = itemsIndex.get(r.id);
        if (item) chooseItem(item); else { els.input.value = r.title; runSearch(r.title); }
      });
      row.appendChild(chip);
    });
    frag.appendChild(row);
  }

  const popLabel = document.createElement("div");
  popLabel.className = "usp-section-label";
  popLabel.textContent = "Popular Searches";
  frag.appendChild(popLabel);

  const popRow = document.createElement("div");
  popRow.className = "usp-chip-row";
  POPULAR_IDS.forEach(id => {
    const item = itemsIndex.get(id);
    if (!item) return;
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "usp-chip";
    chip.innerHTML = '<span aria-hidden="true">' + item.icon + '</span><span>' + escapeHtml(item.title) + '</span>';
    chip.addEventListener("click", () => chooseItem(item));
    popRow.appendChild(chip);
  });
  frag.appendChild(popRow);

  const listLabel = document.createElement("div");
  listLabel.className = "usp-section-label";
  listLabel.textContent = "Suggested";
  frag.appendChild(listLabel);

  els.resultsWrap.appendChild(frag);

  const suggested = SEARCH_ITEMS.slice(0, 6).map(item => ({ item }));
  const list = document.createElement("ul");
  list.className = "usp-list";
  list.id = "uspList";
  list.setAttribute("role", "listbox");
  suggested.forEach((r, i) => {
    const item = r.item;
    const li = document.createElement("li");
    li.className = "usp-item";
    li.style.setProperty("--usp-i", i);
    li.id = "usp-opt-" + item.id;
    li.setAttribute("role", "option");
    li.setAttribute("aria-selected", i === 0 ? "true" : "false");
    li.dataset.id = item.id;
    li.innerHTML =
      '<div class="usp-item-icon" aria-hidden="true">' + item.icon + '</div>' +
      '<div class="usp-item-body"><div class="usp-item-title-row"><div class="usp-item-title">' + escapeHtml(item.title) + '</div></div>' +
      '<div class="usp-item-desc">' + escapeHtml(item.description) + '</div></div>' +
      '<span class="usp-badge">' + escapeHtml(item.category) + '</span>';

  });

}

function renderEmptyState(query){
  els.resultsWrap.innerHTML = "";
  els.highlight.style.opacity = "0";
  currentResults = [];
  activeIndex = -1;
  els.empty.hidden = false;
  document.getElementById("uspEmptySub").textContent = 'No matches for "' + query + '". Try one of these:';

  const sugg = document.getElementById("uspEmptySuggestions");
  sugg.innerHTML = "";
  POPULAR_IDS.slice(0, 4).forEach(id => {
    const item = itemsIndex.get(id);
    if (!item) return;
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "usp-chip";
    chip.textContent = item.title;
    chip.addEventListener("click", () => chooseItem(item));
    sugg.appendChild(chip);
  });
}

function spawnRipple(li, evt){
  const rect = li.getBoundingClientRect();
  const ripple = document.createElement("span");
  ripple.className = "usp-ripple";
  const size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = size + "px";
  ripple.style.left = (evt.clientX - rect.left - size/2) + "px";
  ripple.style.top = (evt.clientY - rect.top - size/2) + "px";
  li.style.position = "relative";
  li.appendChild(ripple);
  setTimeout(() => ripple.remove(), 500);
}

/* ============================================================
   7. SELECTION / SLIDING HIGHLIGHT
   ============================================================ */
function setActiveIndex(i, scrollIntoView){
  if (i === activeIndex) return;
  const prev = document.getElementById(currentResults[activeIndex] ? "usp-opt-" + currentResults[activeIndex].id : "");
  if (prev) prev.setAttribute("aria-selected", "false");
  activeIndex = i;
  const next = currentResults[activeIndex] ? document.getElementById("usp-opt-" + currentResults[activeIndex].id) : null;
  if (next){
    next.setAttribute("aria-selected", "true");
    els.input.setAttribute("aria-activedescendant", next.id);
    if (scrollIntoView) next.scrollIntoView({ block: "nearest" });
  }
  moveHighlightTo(activeIndex, true);
}

function moveHighlightTo(i, animate){
  const item = currentResults[i];
  const el = item ? document.getElementById("usp-opt-" + item.id) : null;
  if (!el){ els.highlight.style.opacity = "0"; return; }
  const top = el.offsetTop;
  const height = el.offsetHeight;
  els.highlight.style.transition = animate
    ? "transform .16s cubic-bezier(.2,.9,.25,1), height .16s cubic-bezier(.2,.9,.25,1), opacity .12s"
    : "none";
  els.highlight.style.transform = "translateY(" + top + "px)";
  els.highlight.style.height = height + "px";
  els.highlight.style.opacity = "1";
  if (!animate){
    void els.highlight.offsetHeight;
    els.highlight.style.transition = "transform .16s cubic-bezier(.2,.9,.25,1), height .16s cubic-bezier(.2,.9,.25,1), opacity .12s";
  }
}

function chooseItem(item){
  const query = els.input.value.trim();
  if (query) pushRecent(item);
  closeSearch();
  try { item.action && item.action(); } catch (e) { console.error("Universal Search action failed:", e); }
}

/* First click/Enter on a result shows an inline preview card with an
   "Open" button. Clicking/pressing Enter again (on the same result,
   now already previewing) actually navigates. This avoids jumping
   the user straight into a page from a single accidental tap. */
function activateOrPreview(item){
  if (previewId === item.id){
    chooseItem(item);
    return;
  }
  if (previewId){
    const prevLi = document.getElementById("usp-opt-" + previewId);
    if (prevLi) collapsePreview(prevLi);
  }
  previewId = item.id;
  const idx = currentResults.findIndex(it => it.id === item.id);
  const li = document.getElementById("usp-opt-" + item.id);
  if (li) expandPreview(li, item);
  if (idx > -1) setActiveIndex(idx, false);
  requestAnimationFrame(() => moveHighlightTo(activeIndex, true));
}

function expandPreview(li, item){
  li.classList.add("usp-item-preview-open");
  if (!li.querySelector(".usp-item-preview")){
    const wrap = document.createElement("div");
    wrap.className = "usp-item-preview";
    wrap.innerHTML =
      '<div class="usp-item-preview-desc">' + escapeHtml(item.description) + '</div>' +
      '<button type="button" class="usp-item-open-btn">Open ' + escapeHtml(item.title) + ' →</button>';
    li.appendChild(wrap);
    wrap.querySelector(".usp-item-open-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      chooseItem(item);
    });
  }
}

function collapsePreview(li){
  li.classList.remove("usp-item-preview-open");
  const p = li.querySelector(".usp-item-preview");
  if (p) p.remove();
}

/* ============================================================
   8. SEARCH EXECUTION
   ============================================================ */
function runSearch(rawQuery){
  previewId = null;
  const query = rawQuery.trim();
  if (!query){
    renderBrowseState();
    return;
  }
  const results = search(query);
  if (!results.length){
    renderEmptyState(query);
  } else {
    renderResultsList(results);
  }
}
const debouncedSearch = debounce(runSearch, 120);

/* ============================================================
   9. OPEN / CLOSE + FOCUS TRAP
   ============================================================ */
function openSearch(){
  if (isOpen) return;
  isOpen = true;
  lastFocused = document.activeElement;
  els.overlay.hidden = false;
  els.overlay.classList.remove("usp-closing");
  els.input.value = "";
  previewId = null;
  renderBrowseState();
  requestAnimationFrame(() => {
    els.input.focus({ preventScroll: true });
    moveHighlightTo(activeIndex, false);
  });
  document.addEventListener("keydown", onKeydown, true);
  document.body.style.overflow = "hidden";
}

function closeSearch(){
  if (!isOpen) return;
  previewId = null;
  els.overlay.classList.add("usp-closing");
  const panel = els.panel;
  const done = () => {
    els.overlay.hidden = true;
    els.overlay.classList.remove("usp-closing");
    panel.removeEventListener("animationend", done);
  };
  panel.addEventListener("animationend", done);
  setTimeout(done, 260);
  isOpen = false;
  document.removeEventListener("keydown", onKeydown, true);
  document.body.style.overflow = "";
  if (lastFocused && typeof lastFocused.focus === "function") lastFocused.focus();
}

function onKeydown(e){
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){
    e.preventDefault();
    isOpen ? closeSearch() : openSearch();
    return;
  }
  if (!isOpen) return;

  switch (e.key){
    case "Escape":
      e.preventDefault();
      closeSearch();
      break;
    case "ArrowDown":
      e.preventDefault();
      if (currentResults.length) setActiveIndex((activeIndex + 1) % currentResults.length, true);
      break;
    case "ArrowUp":
      e.preventDefault();
      if (currentResults.length) setActiveIndex((activeIndex - 1 + currentResults.length) % currentResults.length, true);
      break;
    case "Tab":
      e.preventDefault();
      if (currentResults.length){
        const dir = e.shiftKey ? -1 : 1;
        setActiveIndex((activeIndex + dir + currentResults.length) % currentResults.length, true);
      }
      break;
    case "Home":
      e.preventDefault();
      if (currentResults.length) setActiveIndex(0, true);
      break;
    case "End":
      e.preventDefault();
      if (currentResults.length) setActiveIndex(currentResults.length - 1, true);
      break;
    case "PageDown":
      e.preventDefault();
      if (currentResults.length) setActiveIndex(Math.min(activeIndex + 5, currentResults.length - 1), true);
      break;
    case "PageUp":
      e.preventDefault();
      if (currentResults.length) setActiveIndex(Math.max(activeIndex - 5, 0), true);
      break;
    case "Enter":
      e.preventDefault();
      if (activeIndex > -1 && currentResults[activeIndex]) activateOrPreview(currentResults[activeIndex]);
      break;
  }
}

/* ============================================================
   10. MOBILE SWIPE-TO-CLOSE
   ============================================================ */
function attachSwipeHandlers(){
  els.panel.addEventListener("touchstart", (e) => {
    if (window.innerWidth > 640) return;
    const target = e.target;
    if (target.closest(".usp-body")) return;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  els.panel.addEventListener("touchmove", (e) => {
    if (touchStartY === null) return;
    const dy = e.touches[0].clientY - touchStartY;
    if (dy > 0) els.panel.style.transform = "translateY(" + dy + "px)";
  }, { passive: true });

  els.panel.addEventListener("touchend", (e) => {
    if (touchStartY === null) return;
    const dy = (e.changedTouches[0].clientY - touchStartY);
    els.panel.style.transform = "";
    if (dy > 90) closeSearch();
    touchStartY = null;
  });
}

/* ============================================================
   11. WIRE UP DOM + PUBLIC API
   ============================================================ */
function registerSearchItem(item){
  if (!item || !item.id) throw new Error("registerSearchItem: item.id is required");
  itemsIndex.set(item.id, item);
}
function removeSearchItem(id){
  itemsIndex.delete(id);
}

function init(){
  els.overlay = document.getElementById("uspOverlay");
  els.panel = document.getElementById("uspPanel");
  els.input = document.getElementById("uspInput");
  els.body = document.getElementById("uspBody");
  els.resultsWrap = document.getElementById("uspResultsWrap");
  els.highlight = document.getElementById("uspHighlight");
  els.empty = document.getElementById("uspEmpty");

  els.input.addEventListener("input", (e) => debouncedSearch(e.target.value));
  els.overlay.addEventListener("click", (e) => {
    if (e.target.hasAttribute("data-usp-close")) closeSearch();
  });
  document.querySelectorAll("[data-usp-open]").forEach(el => {
    el.addEventListener("click", openSearch);
  });
  window.addEventListener("resize", () => { if (isOpen) moveHighlightTo(activeIndex, false); });
  attachSwipeHandlers();

  document.addEventListener("keydown", (e) => {
    if (!isOpen && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){
      e.preventDefault();
      openSearch();
    }
  });
}

if (document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}

window.KSUniversalSearch = { openSearch, closeSearch, search, registerSearchItem, removeSearchItem };

})();

  return onSnapshot(doc(db,'siteConfig','about'), function(snap){

  }, function(err){
    callback(null, err);
  });
}
function saveAboutPhoto(dataUrl){
  return setDoc(doc(db,'siteConfig','about'), { photoDataUrl: dataUrl, updatedAt: serverTimestamp() }, { merge: true });
}

function subscribeAnnouncements(callback){
  const q = query(collection(db,'announcements'), orderBy('createdAt','desc'), limit(50));
  return onSnapshot(q, function(snap){
    const list=[];
    snap.forEach(function(d){ list.push(Object.assign({id:d.id}, d.data())); });
    callback(list, null);
  }, function(err){
    callback(null, err);
  });
}
function createAnnouncement(data){
  return addDoc(collection(db,'announcements'), Object.assign({}, data, { createdAt: serverTimestamp() }));
}
function updateAnnouncement(id, data){
  return updateDoc(doc(db,'announcements',id), data);
}
function deleteAnnouncement(id){
  return deleteDoc(doc(db,'announcements',id));
}

// Admin can read every inboxMessages doc (isAdmin() OR clause in the rules),
// so this lists everything ever sent for the dashboard's "Sent messages" view.
function subscribeAllInboxMessages(callback){
  const q = query(collection(db,'inboxMessages'), orderBy('createdAt','desc'), limit(100));
  return onSnapshot(q, function(snap){
    const list=[];
    snap.forEach(function(d){ list.push(Object.assign({id:d.id}, d.data())); });
    callback(list, null);
  }, function(err){
    callback(null, err);
  });
}
function sendInboxMessage(toUid, text){
  const user = auth.currentUser;
  if(!user) return Promise.reject(new Error('Not signed in.'));
  const clean = String(text||'').trim().slice(0,1000);
  if(!clean) return Promise.reject(new Error('Please write a message.'));
  if(!toUid) return Promise.reject(new Error('Please provide a recipient UID.'));
  return addDoc(collection(db,'inboxMessages'), {
    toUid: String(toUid).trim(),
    fromUid: user.uid,
    text: clean,
    createdAt: serverTimestamp(),
    read: false
  });
}
function deleteInboxMessage(id){
  return deleteDoc(doc(db,'inboxMessages',id));
}

// Regular users can only read messages addressed to them (rules: toUid == auth.uid || isAdmin()).
// NOTE: deliberately no orderBy() here. Combining where('toUid','==',...) with
// orderBy('createdAt') on a different field requires a Firestore *composite*
// index that isn't created automatically — without it this query fails with a
// failed-precondition error. Sorting client-side avoids needing that index at
// all, so messages show up immediately with zero Firebase console setup.
function subscribeMyInbox(callback){
  const user = auth.currentUser;
  if(!user) return function(){};
  const q = query(collection(db,'inboxMessages'), where('toUid','==',user.uid), limit(100));
  return onSnapshot(q, function(snap){
    const list=[];
    snap.forEach(function(d){ list.push(Object.assign({id:d.id}, d.data())); });
    list.sort(function(a,b){
      const at = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
      const bt = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
      return bt - at;
    });
    callback(list, null);
  }, function(err){
    callback(null, err);
  });
}
function markInboxRead(id){
  return updateDoc(doc(db,'inboxMessages',id), { read: true });
}

// PDF Toolkit — merge history (added). Stores only lightweight metadata
// (file names + page count), never the actual PDF bytes, to stay well
// within Firestore's free-tier document size limits.
function savePdfMergeHistory(entry){
  const user = auth.currentUser;
  if(!user) return Promise.resolve(null);
  return addDoc(collection(db,'pdfMergeHistory'), {
    uid: user.uid,
    fileNames: (entry && entry.fileNames) || [],
    pageCount: (entry && entry.pageCount) || 0,
    createdAt: serverTimestamp()
  });
}
// Deliberately no orderBy() combined with where() here — see subscribeMyInbox
// above for why: avoids needing a composite index in the Firebase console.
function subscribeMyPdfHistory(callback){
  const user = auth.currentUser;
  if(!user) return function(){};
  const q = query(collection(db,'pdfMergeHistory'), where('uid','==',user.uid), limit(20));
  return onSnapshot(q, function(snap){
    const list=[];
    snap.forEach(function(d){ list.push(Object.assign({id:d.id}, d.data())); });
    list.sort(function(a,b){
      const at = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
      const bt = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
      return bt - at;
    });
    callback(list, null);
  }, function(err){
    callback(null, err);
  });
}

function deleteAccount(){
  const user = auth.currentUser;
  if(!user) return Promise.reject(new Error('Not signed in.'));
  // Delete the Firestore profile doc first, while still authenticated, then the auth account itself.
  return deleteDoc(doc(db, 'users', user.uid)).catch(function(){}).then(function(){
    return deleteUser(user);
  });
}

function loadAndBroadcastUser(user){
  if(!user){
    if(window.onKsAuthStateChanged) window.onKsAuthStateChanged(null);
    return;
  }
  getDoc(doc(db, 'users', user.uid)).then(function(snap){
    const photoDataUrl = snap.exists() ? (snap.data().photoDataUrl || null) : null;
    const prefs = snap.exists() ? (snap.data().prefs || null) : null;
    if(window.onKsAuthStateChanged) window.onKsAuthStateChanged(toPlainUser(user, photoDataUrl, prefs));
  }).catch(function(){
    // If Firestore read fails (e.g. rules not set up yet), still sign the user in without a photo/prefs
    if(window.onKsAuthStateChanged) window.onKsAuthStateChanged(toPlainUser(user, null, null));
  });
}

// Expose a small, stable API to the rest of the (non-module) app
window.KSFirebase = {
  googleSignIn: function(){
    return signInWithPopup(auth, googleProvider).then(function(cred){
      return ensureUserDoc(cred.user).then(function(){ return cred; });
    });
  },
  emailSignUp: function(email, password, name){
    return createUserWithEmailAndPassword(auth, email, password).then(function(cred){
      const p = name ? updateProfile(cred.user, { displayName: name }) : Promise.resolve();
      return p.then(function(){ return ensureUserDoc(cred.user, { displayName: name || '' }); }).then(function(){ return cred; });
    });
  },
  emailSignIn: function(email, password){ return signInWithEmailAndPassword(auth, email, password); },
  doSignOut: function(){ return signOut(auth); },
  sendReset: function(email){ return sendPasswordResetEmail(auth, email); },
  saveProfilePic: saveProfilePic,
  updateDisplayName: updateDisplayName,
  deleteAccount: deleteAccount,
  savePrefs: savePrefs,
  postCommunityMessage: postCommunityMessage,
  subscribeCommunity: subscribeCommunity,
  editCommunityPost: editCommunityPost,
  deleteCommunityPost: deleteCommunityPost,
  pinCommunityPost: pinCommunityPost,
  reactToPost: reactToPost,
  addReply: addReply,
  subscribeReplies: subscribeReplies,
  editReply: editReply,
  deleteReply: deleteReply,
  // admin dashboard (added)
  adminGetSecurity: adminGetSecurity,
  adminSetPin: adminSetPin,
  subscribeFeatureFlags: subscribeFeatureFlags,
  setFeatureFlag: setFeatureFlag,
  deleteFeatureFlag: deleteFeatureFlag,
  subscribeAboutPhoto: subscribeAboutPhoto,
  saveAboutPhoto: saveAboutPhoto,
  subscribeAnnouncements: subscribeAnnouncements,
  createAnnouncement: createAnnouncement,
  updateAnnouncement: updateAnnouncement,
  deleteAnnouncement: deleteAnnouncement,
  subscribeAllInboxMessages: subscribeAllInboxMessages,
  sendInboxMessage: sendInboxMessage,
  deleteInboxMessage: deleteInboxMessage,
  subscribeMyInbox: subscribeMyInbox,
  markInboxRead: markInboxRead,
  savePdfMergeHistory: savePdfMergeHistory,
  subscribeMyPdfHistory: subscribeMyPdfHistory
};

onAuthStateChanged(auth, loadAndBroadcastUser);

</script>
