}
body.theme-vintage .inner-card,
body.theme-vintage .about-card,
body.theme-vintage .cycle-stat,
body.theme-vintage .cycle-result-box,
body.theme-vintage .settings-menu-item,
body.theme-vintage .settings-row,
body.theme-vintage .app-card,
body.theme-vintage .modal-box,
body.theme-vintage .settings-drawer{
  border-radius:4px !important;
  border:1px solid var(--border) !important;
  box-shadow:none !important;
}
body.theme-vintage .btn,
body.theme-vintage .settings-btn,
body.theme-vintage .easy-exit,
body.theme-vintage .easy-tile{
  border-radius:2px !important;border:1px solid var(--border) !important;
  text-transform:uppercase;letter-spacing:.08em;font-size:12.5px;
}
body.theme-vintage .btn-primary{
  background:var(--accent) !important;color:#1A140D !important;border:none !important;
}

/* ── BORING / MINIMAL THEME (added) ── */
body.theme-boring{
  --accent-glow:transparent;
  background-image:none !important;
}
html[data-theme="light"] body.theme-boring{
  --bg:#FFFFFF; --bg2:#FFFFFF; --surface:#FFFFFF; --surface2:#F7F7F7;
  --border:#CCCCCC; --text:#000000; --muted:#555555; --sub:#888888;
  --accent:#0000EE; --accent2:#551A8B;
}
html[data-theme="dark"] body.theme-boring{
  --bg:#000000; --bg2:#000000; --surface:#0A0A0A; --surface2:#141414;
  --border:#333333; --text:#FFFFFF; --muted:#AAAAAA; --sub:#777777;
  --accent:#6699FF; --accent2:#9C7FE0;
}
body.theme-boring #stars{display:none;}
body.theme-boring, body.theme-boring *{
  font-family:Arial,Helvetica,sans-serif !important;letter-spacing:0 !important;
  text-transform:none !important;text-shadow:none !important;
}
body.theme-boring .inner-card,
body.theme-boring .about-card,
body.theme-boring .cycle-stat,
body.theme-boring .cycle-result-box,
body.theme-boring .settings-menu-item,
body.theme-boring .settings-row,
body.theme-boring .app-card,
body.theme-boring .modal-box,
body.theme-boring .settings-drawer,
body.theme-boring .btn,
body.theme-boring .settings-btn,
body.theme-boring .easy-exit,
body.theme-boring .easy-tile,
body.theme-boring .ks-switch,
body.theme-boring .palette-swatch,
body.theme-boring .pos-btn,
body.theme-boring .clock-circle-btn{
  border-radius:0 !important;
  box-shadow:none !important;
  border:1px solid var(--border) !important;
}
body.theme-boring .btn-primary{
  background:var(--accent) !important;color:#FFFFFF !important;border:1px solid var(--accent) !important;
}
body.theme-boring .app-icon,
body.theme-boring .feat-icon,
body.theme-boring .easy-icon,
body.theme-boring .settings-menu-icon{display:none;}

/* ── CALM THEME (added) — soft pastel, low-stimulation theme for anxiety/ADHD relief.
   Warm cream + sage palette, generous rounded corners, gentle shadows, no busy starfield,
   no jumpy hover motion. Both its light and dark variants stay soft — even "dark" avoids
   near-black so nothing here reads as harsh. ── */
body.theme-calm{
  --accent-glow:rgba(159,194,154,0.24);
  background-image:none !important;
}
html[data-theme="light"] body.theme-calm{
  --bg:#F7F3E9; --bg2:#F0EAD9; --surface:#FFFEFA; --surface2:#F3EEE0;
  --border:#E5DEC9; --text:#55503F; --muted:#948E78; --sub:#B7B097;
  --accent:#9FC29A; --accent2:#7FA679; --card-shadow:0 10px 30px rgba(120,110,80,0.09);
}
html[data-theme="dark"] body.theme-calm{
  --bg:#2A2D25; --bg2:#30332A; --surface:#383C31; --surface2:#414636;
  --border:#525845; --text:#EDE9DC; --muted:#B7B29E; --sub:#8F8B78;
  --accent:#AECFA2; --accent2:#9FC29A; --card-shadow:0 10px 30px rgba(0,0,0,0.24);
}
body.theme-calm #stars{display:none;}
body.theme-calm *{scroll-behavior:smooth;}
body.theme-calm .inner-card,
body.theme-calm .about-card,
body.theme-calm .cycle-stat,
body.theme-calm .cycle-result-box,
body.theme-calm .settings-menu-item,
body.theme-calm .settings-row,
body.theme-calm .app-card,
body.theme-calm .modal-box,
body.theme-calm .settings-drawer,
body.theme-calm .community-post,
body.theme-calm .community-menu-popup,
body.theme-calm .lifestat-card,
body.theme-calm .lifestat-hero{
  border-radius:26px !important;
  box-shadow:var(--card-shadow) !important;
  border:1px solid var(--border) !important;
}
html[data-theme="light"] body.theme-calm .inner-card,
html[data-theme="light"] body.theme-calm .app-card,
html[data-theme="light"] body.theme-calm .lifestat-card,
html[data-theme="light"] body.theme-calm .lifestat-hero{
  box-shadow:var(--card-shadow), 0 0 0 3px rgba(255,255,255,0.55) !important;
}
body.theme-calm .app-card:hover{
  transform:none !important;
  box-shadow:0 10px 30px rgba(120,110,80,0.14) !important;
  border-color:var(--accent) !important;
}
body.theme-calm .btn,
body.theme-calm .settings-btn,
body.theme-calm .easy-exit,
body.theme-calm .easy-tile,
body.theme-calm .app-icon,
body.theme-calm .easy-icon,
body.theme-calm .lifestat-icon{
  border-radius:18px !important;
}
body.theme-calm .btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2)) !important;
  color:#243020 !important;
  box-shadow:0 4px 16px var(--accent-glow) !important;
}
body.theme-calm .btn-primary:hover{
  box-shadow:0 6px 20px var(--accent-glow) !important;
  transform:translateY(-1px) !important;
}
body.theme-calm .ks-switch,
body.theme-calm .palette-swatch,
body.theme-calm .pos-btn,
body.theme-calm .clock-circle-btn{
  border-radius:999px !important;
}

.unit-chip-row{display:inline-flex;gap:4px;margin-left:8px;}
.unit-chip{
  background:var(--surface2);border:1px solid var(--border);border-radius:20px;
  padding:3px 10px;font-size:10.5px;color:var(--muted);cursor:pointer;
}
.unit-chip.active{background:var(--accent);border-color:var(--accent);color:#0A0C14;font-weight:700;}

/* ── EASY MODE (added) ── */
.sudoku-controls-row{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:14px;}
.sudoku-toggle-row{display:flex;gap:8px;}
.sudoku-icon-toggle{
  width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);
  background:var(--bg2);color:var(--muted);font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;
}
.sudoku-icon-toggle.active{background:var(--accent);border-color:var(--accent);color:#0A0C14;}
.sudoku-diff-group{display:flex;gap:8px;flex-wrap:wrap;}
.sudoku-toggle-group{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.sudoku-toggle-chip{
  background:transparent;border:1px solid var(--border);color:var(--muted);
  border-radius:20px;padding:6px 12px;font-size:11.5px;cursor:pointer;
  display:flex;align-items:center;gap:5px;transition:border-color .2s,color .2s;
}
.sudoku-toggle-chip.active{border-color:var(--accent);color:var(--accent);}

.easy-wrap{max-width:640px;margin:0 auto;padding:32px 20px 60px;}
.easy-header{text-align:center;margin-bottom:28px;}
.easy-header h1{font-family:Syne,sans-serif;font-weight:800;font-size:1.8rem;margin-bottom:8px;}
.easy-header p{color:var(--muted);font-size:14px;}
.easy-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.easy-tile{
  background:var(--surface);border:2px solid var(--border);border-radius:22px;
  padding:28px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;cursor:pointer;transition:border-color .2s,transform .15s;min-height:140px;text-align:center;
}
.easy-tile:active{transform:scale(.96);}
.easy-tile:hover{border-color:var(--accent);}
.easy-tile .easy-icon{font-size:2.6rem;}
.easy-tile .easy-label{font-family:Syne,sans-serif;font-weight:800;font-size:1.05rem;}
.easy-tile.wide{grid-column:1/-1;flex-direction:row;min-height:auto;padding:20px;gap:16px;}
.easy-exit{
  display:block;margin:32px auto 0;background:none;border:1px solid var(--border);
  color:var(--muted);padding:12px 20px;border-radius:14px;cursor:pointer;font-size:13px;
}

.clock-picker-grid{display:flex;flex-direction:column;gap:14px;}
.clock-picker-card{
  display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);
  border-radius:20px;padding:22px;cursor:pointer;transition:border-color .2s;
}
.clock-picker-card:hover{border-color:var(--accent);}
.clock-picker-card .icon{font-size:2.2rem;}
.clock-picker-card strong{display:block;font-family:Syne,sans-serif;font-size:1.1rem;}
.clock-picker-card span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;}
.clock-dial-wrap{position:relative;width:260px;height:260px;margin:20px auto;}
.clock-dial-canvas{width:260px;height:260px;}
.clock-readout{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;
}
.clock-readout .big{font-family:Syne,sans-serif;font-weight:800;font-size:1.9rem;color:var(--text);}
.clock-readout .small{font-size:12px;color:var(--muted);margin-bottom:4px;}
.clock-readout .sub{font-size:12px;color:var(--muted);margin-top:4px;}
.clock-btn-row{display:flex;justify-content:center;gap:24px;margin-top:24px;}
.clock-btn-row.three{gap:10px;}
.clock-btn-row.three .clock-circle-btn{width:74px;height:74px;font-size:12.5px;}
.clock-circle-btn{
  width:88px;height:88px;border-radius:50%;border:none;cursor:pointer;
  font-family:Syne,sans-serif;font-weight:700;font-size:14px;
  display:flex;align-items:center;justify-content:center;
}
.clock-circle-btn.primary{background:var(--accent);color:#0A0C14;}
.clock-circle-btn.danger{background:rgba(248,113,113,0.18);color:#f87171;}
.clock-circle-btn.neutral{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.clock-setup-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin-bottom:14px;}
.clock-setup-grid label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.clock-setup-grid input{
  width:100%;text-align:center;font-family:Syne,sans-serif;font-weight:800;font-size:1.8rem;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 4px;color:var(--text);
}
.clock-preset-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px;}
.clock-preset-chip{
  background:var(--surface2);border:1px solid var(--border);border-radius:30px;padding:10px 18px;
  font-size:13px;color:var(--text);cursor:pointer;
}
.clock-lap-list{max-height:160px;overflow-y:auto;border-radius:12px;overflow:hidden;margin-top:16px;}

/* ── SETTINGS ICON + DRAWER (added) ── */
.settings-icon-btn{
  position:relative;
  background:none;border:1px solid var(--border);color:var(--text);
  width:36px;height:36px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:1.05rem;
  transition:transform .2s,border-color .2s;flex-shrink:0;
}
.settings-icon-btn.has-badge::after{
  content:'';position:absolute;top:1px;right:1px;width:10px;height:10px;
  border-radius:50%;background:#e5484d;border:2px solid var(--bg2);
}
.settings-icon-btn:hover{transform:rotate(35deg);border-color:var(--accent);}
.settings-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
  z-index:10001;opacity:0;pointer-events:none;transition:opacity .25s;
}
.settings-overlay.open{opacity:1;pointer-events:all;}
.settings-drawer{
  position:fixed;top:0;right:0;height:100%;width:360px;max-width:88vw;
  background:var(--bg2);border-left:1px solid var(--border);
  z-index:10002;box-shadow:-8px 0 40px rgba(0,0,0,.5);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;overflow-y:auto;
}
.settings-drawer.open{transform:translateX(0);}
.settings-drawer-header{
  padding:18px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:var(--bg2);z-index:2;
}
.settings-drawer-header h3{font-family:Syne,sans-serif;font-weight:800;font-size:1.15rem;}
.settings-close-btn{background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;padding:4px 8px;}
.settings-body{padding:18px 20px 40px;display:flex;flex-direction:column;gap:26px;}
.settings-section-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:10px;}
.settings-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 14px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;margin-bottom:10px;
}
.settings-row-text strong{display:block;font-size:14px;}
.settings-row-text span{display:block;font-size:12px;color:var(--muted);margin-top:2px;}
.ks-switch{
  position:relative;width:46px;height:26px;border-radius:20px;border:none;cursor:pointer;
  background:var(--border);flex-shrink:0;transition:background .2s;
}
.ks-switch::after{
  content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.3);
}
.ks-switch.on{background:var(--accent);}
.ks-switch.on::after{transform:translateX(20px);}
.settings-btn{
  width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);
  color:var(--text);padding:12px 14px;border-radius:14px;cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;
  font-family:'DM Sans',sans-serif;transition:border-color .2s;
}
.settings-btn:hover{border-color:var(--accent);}
.fb-textarea{
  width:100%;min-height:90px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:12px;color:var(--text);font-family:'DM Sans',sans-serif;
  font-size:13px;resize:vertical;outline:none;margin-bottom:10px;
}
.fb-textarea:focus{border-color:var(--accent);}
.fb-status{font-size:12.5px;margin-top:8px;line-height:1.5;}

/* ── AUTH / ACCOUNT (added) ── */
.auth-wrap{max-width:420px;margin:0 auto;}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:32px;box-shadow:var(--card-shadow);}
.auth-card h2{font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;margin-bottom:6px;}
.auth-card .subtitle{color:var(--muted);font-size:14px;margin-bottom:22px;}
.auth-tab-row{display:flex;gap:6px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:4px;margin-bottom:22px;}
.auth-tab{flex:1;text-align:center;padding:10px 0;border-radius:11px;border:none;background:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:600;cursor:pointer;transition:all .2s;}
.auth-tab.active{background:var(--surface);color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.25);}
.btn-google{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:13px 16px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--surface);color:var(--text);font-family:'DM Sans',sans-serif;
  font-size:14.5px;font-weight:600;cursor:pointer;transition:background .2s,border-color .2s;
}
.btn-google:hover{background:var(--surface2);border-color:var(--accent);}
.btn-google svg{width:18px;height:18px;flex-shrink:0;}
.auth-divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--sub);font-size:12px;text-transform:uppercase;letter-spacing:.5px;}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.auth-switch-txt{text-align:center;font-size:13.5px;color:var(--muted);margin-top:18px;}
.auth-switch-txt a{color:var(--accent);cursor:pointer;font-weight:600;text-decoration:none;}
.auth-error{background:rgba(255,90,90,.12);border:1px solid rgba(255,90,90,.35);color:#FF5A5A;font-size:13px;padding:10px 14px;border-radius:12px;margin-bottom:16px;line-height:1.5;}
.auth-success{background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.35);color:#4ADE80;font-size:13px;padding:10px 14px;border-radius:12px;margin-bottom:16px;line-height:1.5;}
.auth-forgot{display:block;text-align:right;font-size:12.5px;color:var(--muted);cursor:pointer;margin:-8px 0 16px;}
.auth-forgot:hover{color:var(--accent);}

/* nav auth slot */
.nav-auth-btn{
  display:flex;align-items:center;gap:6px;padding:0 14px;height:36px;border-radius:100px;
  background:linear-gradient(135deg,var(--accent),#FF8C42);color:#1a1200;border:none;
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;
}
/* Fixed (added): #navAuthSlotDesktop / #navAuthSlotMobile are plain <span>s (inline),
   but nav-avatar-btn below sets display:flex — a BLOCK-level box per CSS spec.
   A block box inside an inline parent forces a line break, which is what was
   dropping the profile picture onto its own row under the inbox/shield icons.
   Making the slot itself an inline-flex row fixes that regardless of what
   display any individual child uses, and the gap here replaces the old
   ad-hoc margin-left on the avatar button. */
#navAuthSlotDesktop,#navAuthSlotMobile{display:inline-flex;align-items:center;gap:10px;}
.nav-avatar-btn{
  width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border);cursor:pointer;
  background:var(--surface2);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-weight:700;font-size:14px;color:var(--accent);padding:0;
}
.nav-avatar-btn img{width:100%;height:100%;object-fit:cover;}

/* nav icon cluster (added) — bell + shield sit in their own evenly-spaced
   group before the avatar, instead of being concatenated with zero gap. */
.nav-icon-cluster{display:inline-flex;align-items:center;gap:10px;flex-shrink:0;}
.nav-icon-btn{
  position:relative;width:36px;height:36px;border-radius:50%;padding:0;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface2);border:1.5px solid var(--border);cursor:pointer;
  font-size:15px;line-height:1;transition:background .2s,border-color .2s,transform .2s;
}
.nav-icon-btn:hover{background:var(--surface);border-color:var(--accent);transform:translateY(-1px);}
.nav-icon-badge{
  position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;
  border-radius:100px;background:linear-gradient(135deg,#FF5A5A,#E5484D);color:#fff;
  font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;
  line-height:1;border:1.5px solid var(--bg);box-sizing:content-box;
}

/* account panel */
.avatar-upload-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;}
.avatar-big{
  width:88px;height:88px;border-radius:50%;background:var(--surface2);border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-family:'Syne',sans-serif;font-weight:800;font-size:28px;color:var(--accent);position:relative;
}
.avatar-big img{width:100%;height:100%;object-fit:cover;}
.avatar-edit-label{font-size:12.5px;font-weight:600;color:var(--accent);cursor:pointer;}
.account-info-row{padding:12px 0;border-bottom:1px solid var(--border);}
.account-info-row span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:3px;}
.account-info-row strong{font-size:14.5px;font-weight:600;word-break:break-word;}
.danger-zone{margin-top:26px;padding-top:20px;border-top:1px dashed rgba(255,90,90,.3);}
.danger-zone h4{color:#FF5A5A;font-size:13px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.btn-danger{
  width:100%;padding:13px 16px;border-radius:12px;border:1.5px solid rgba(255,90,90,.4);
  background:rgba(255,90,90,.08);color:#FF5A5A;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;
}
.btn-danger:hover{background:rgba(255,90,90,.16);}
.auth-spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:authspin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes authspin{to{transform:rotate(360deg);}}
.fb-status.ok{color:#3fbf6f;}
.fb-status.err{color:#e5484d;}
.pos-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.pos-btn{
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  border-radius:12px;padding:10px 8px;font-size:12px;cursor:pointer;
}
.pos-btn.active{border-color:var(--accent);color:var(--accent);}
.ks-switch .theme-icon{font-size:11px;}
.ks-switch .theme-icon.moon{left:5px;}
.ks-switch .theme-icon.sun{right:5px;}
.ks-chat-fab.ks-draggable{cursor:grab;touch-action:none;}
.ks-chat-fab.ks-dragging{cursor:grabbing;animation:none;transition:none;}
/* ── BACKGROUND TIMER PILL (Dynamic-Island style, vertical swipe) ── */
.ks-timer-pill{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  z-index:9998;display:none;flex-direction:column;align-items:stretch;
  padding:5px;border-radius:20px;width:192px;
  background:rgba(10,12,20,0.88);backdrop-filter:blur(18px);
  border:1px solid var(--border);color:#EDF0FA;
  font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14px;letter-spacing:.3px;
  box-shadow:0 6px 24px rgba(0,0,0,.45),0 0 0 1px var(--accent-glow);
  user-select:none;
}
.ks-timer-pill.show{display:flex;}
.ks-timer-pill.ks-dragging{transition:none;}
.ks-pill-drag{cursor:grab;touch-action:none;opacity:.45;font-size:11px;text-align:center;padding:1px 0 3px;line-height:1;letter-spacing:1px;}
.ks-pill-drag:active{cursor:grabbing;}
.ks-pill-scroll{
  display:flex;flex-direction:column;overflow-y:auto;scroll-snap-type:y mandatory;touch-action:pan-y;
  max-height:34px;border-radius:15px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.ks-pill-scroll::-webkit-scrollbar{display:none;}
.ks-pill-page{
  flex:0 0 auto;min-height:34px;scroll-snap-align:center;
  display:none;align-items:center;gap:7px;padding:2px 6px;
  white-space:nowrap;cursor:pointer;
}
.ks-pill-page .ks-pill-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);flex-shrink:0;animation:ksPillPulse 1.2s ease-in-out infinite;}
.ks-pill-page.finished .ks-pill-dot{background:#e5484d;box-shadow:0 0 8px #e5484d;animation:ksPillPulse .6s ease-in-out infinite;}
.ks-pill-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.ks-pill-x{margin-left:2px;opacity:.55;font-size:12px;padding:3px 5px;border-radius:50%;line-height:1;flex-shrink:0;}
.ks-pill-x:hover{opacity:1;background:rgba(255,255,255,.1);}
.ks-pill-restart{opacity:.8;font-size:12px;padding:3px 5px;border-radius:50%;line-height:1;flex-shrink:0;}
.ks-pill-restart:hover{opacity:1;background:rgba(255,255,255,.1);}
.ks-pill-page.finished .ks-pill-restart{opacity:1;background:rgba(255,255,255,.14);}
.ks-pill-page.finished .ks-pill-x{opacity:1;background:rgba(229,72,77,.22);color:#ff9195;}
@keyframes ksPillPulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.about-hero{padding:40px 20px 10px;text-align:center;}
.about-block{
  max-width:720px;margin:0 auto;padding:0 20px 60px;display:flex;flex-direction:column;gap:22px;
}
.about-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px 22px;}
.about-card h3{font-family:Syne,sans-serif;font-size:1.05rem;margin-bottom:8px;}
.about-card p{color:var(--muted);font-size:13.5px;line-height:1.75;margin-bottom:8px;}
.about-links-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}

/* ── KS AI CHATBOT ── */
.ks-chat-fab{
  position:fixed;bottom:24px;right:20px;z-index:9999;
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,#F5A623,#E8860A);
  border:none;cursor:pointer;
  box-shadow:0 4px 20px rgba(245,166,35,0.5);
  font-size:1.5rem;display:flex;align-items:center;justify-content:center;
  transition:transform .2s,box-shadow .2s;
  animation:fabPulse 2.5s ease-in-out infinite;
}
.ks-chat-fab:hover{transform:scale(1.1);box-shadow:0 6px 28px rgba(245,166,35,0.7);}
@keyframes fabPulse{0%,100%{box-shadow:0 4px 20px rgba(245,166,35,0.5);}50%{box-shadow:0 4px 32px rgba(245,166,35,0.8);}}
.ks-chat-panel{
  position:fixed;bottom:90px;right:16px;z-index:9998;
  width:340px;max-width:calc(100vw - 32px);
  height:500px;max-height:calc(100vh - 120px);
  background:var(--bg2);border:1px solid var(--border);
  border-radius:20px;display:flex;flex-direction:column;
  box-shadow:0 8px 40px rgba(0,0,0,0.5);
  transform:scale(0) translateY(20px);transform-origin:bottom right;
  opacity:0;transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .2s;
  pointer-events:none;
}
.ks-chat-panel.open{transform:scale(1) translateY(0);opacity:1;pointer-events:all;}
.ks-chat-header{
  padding:14px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  border-radius:20px 20px 0 0;
  background:linear-gradient(135deg,rgba(245,166,35,0.15),rgba(245,166,35,0.05));
}
.ks-chat-title{font-family:Syne,sans-serif;font-weight:700;font-size:15px;color:var(--accent);}
.ks-chat-subtitle{font-size:11px;color:var(--muted);margin-top:1px;}
.ks-chat-close{background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:4px;}
.ks-chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;}
.ks-chat-messages::-webkit-scrollbar{width:4px;}
.ks-chat-messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.ks-msg{max-width:85%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.5;animation:msgIn .2s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.ks-msg.user{background:linear-gradient(135deg,#F5A623,#E8860A);color:#000;font-weight:500;align-self:flex-end;border-radius:14px 14px 4px 14px;}
.ks-msg.bot{background:var(--surface);border:1px solid var(--border);color:var(--text);align-self:flex-start;border-radius:14px 14px 14px 4px;}
.ks-msg.typing{opacity:0.6;}
.ks-chat-input-row{padding:10px;border-top:1px solid var(--border);display:flex;gap:8px;border-radius:0 0 20px 20px;}
.ks-chat-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 13px;color:var(--text);font-family:DM Sans,sans-serif;font-size:13px;resize:none;outline:none;max-height:80px;}
.ks-chat-input:focus{border-color:var(--accent);}
.ks-chat-send{width:38px;height:38px;border-radius:10px;background:var(--accent);border:none;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .2s;}
.ks-chat-send:disabled{opacity:0.4;cursor:not-allowed;}
.ks-chat-suggestions{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 8px;}
.ks-sugg-btn{font-size:11px;padding:5px 10px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap;}
.ks-sugg-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ── SCIENCE SOLVER ── */
.science-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.sci-result{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px;margin-top:14px;font-size:14px;color:var(--text);line-height:1.8;white-space:pre-wrap;animation:fadeUp .3s ease;}
.sci-loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;padding:16px 0;}
.sci-dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin:0 2px;animation:sciDot 1.2s ease-in-out infinite;}
.sci-dots span:nth-child(2){animation-delay:.2s;}
.sci-dots span:nth-child(3){animation-delay:.4s;}
@keyframes sciDot{0%,80%,100%{transform:scale(0.6);opacity:.4;}40%{transform:scale(1);opacity:1;}}

/* ── EMERGENCY MAINTENANCE OVERLAY (added) ──
   Every selector below is scoped under #ksMaintenanceOverlay so it can
   never leak out and affect the rest of the site's styling (this markup
   deliberately reuses generic class names like .card/.grid/.box that would
   otherwise collide with the app's own CSS). */
#ksMaintenanceOverlay{position:fixed;inset:0;z-index:999999;display:none;flex-direction:column;overflow:auto;
  background:#090b12;background-image:radial-gradient(circle at top left,#18234a,transparent 30%),radial-gradient(circle at bottom right,#2b1355,transparent 30%);
  color:#f4f7ff;font-family:'Inter',sans-serif;}
#ksMaintenanceOverlay.show{display:flex;}
#ksMaintenanceOverlay .ksm-logo{padding:24px 32px;font-size:1.4rem;font-weight:800;}
#ksMaintenanceOverlay .ksm-logo span{background:linear-gradient(90deg,#5b8cff,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
#ksMaintenanceOverlay .ksm-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;}
#ksMaintenanceOverlay .ksm-card{max-width:760px;width:100%;background:rgba(24,28,40,.72);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:42px;text-align:center;animation:ksmFloat 4s ease-in-out infinite;}
#ksMaintenanceOverlay .ksm-badge{display:inline-block;padding:8px 16px;border-radius:999px;background:#23345f;border:1px solid #3c66d8;margin-bottom:16px;}
#ksMaintenanceOverlay h1{font-size:clamp(2.2rem,5vw,3.6rem);margin-bottom:14px;}
#ksMaintenanceOverlay p{color:#a9b3c7;line-height:1.7;}
#ksMaintenanceOverlay .ksm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:28px 0;}
#ksMaintenanceOverlay .ksm-box{padding:16px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);}
#ksMaintenanceOverlay .ksm-bar{height:8px;background:#222;border-radius:999px;overflow:hidden;margin-bottom:24px;}
#ksMaintenanceOverlay .ksm-bar div{height:100%;width:35%;background:linear-gradient(90deg,#5b8cff,#8b5cf6);animation:ksmLoad 2s linear infinite;}
#ksMaintenanceOverlay button.ksm-btn{padding:14px 22px;border:0;border-radius:14px;background:linear-gradient(90deg,#5b8cff,#8b5cf6);color:#fff;font-weight:700;cursor:not-allowed;}
#ksMaintenanceOverlay .ksm-footer{text-align:center;padding:18px;color:#8d96aa;}
#ksMaintenanceOverlay .ksm-v{position:fixed;right:16px;bottom:16px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#b8c0d3;}
@keyframes ksmLoad{0%{transform:translateX(-130%)}100%{transform:translateX(420%)}}
@keyframes ksmFloat{50%{transform:translateY(-5px)}}
#ksMaintenanceAdminBanner{display:none;position:fixed;left:0;right:0;top:0;z-index:999998;background:#c81e3a;color:#fff;text-align:center;font-size:12.5px;font-weight:700;padding:8px 14px;box-shadow:0 2px 12px rgba(200,30,58,.4);}
#ksMaintenanceAdminBanner.show{display:block;}

/* ── EMERGENCY SITE PAUSE — admin toggle (added) ──
   Deliberately styled to look nothing like the other flag toggles, so it
   can't be mistaken for a routine per-feature switch. */
.admin-maintenance-card{border:2px solid #c81e3a;background:linear-gradient(180deg,rgba(200,30,58,.10),transparent 60%);box-shadow:0 0 0 1px rgba(200,30,58,.25),0 8px 24px rgba(200,30,58,.15);}
.admin-maintenance-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;background:rgba(200,30,58,.08);border-radius:14px;border:1px solid rgba(200,30,58,.35);}
.admin-maintenance-label{font-weight:800;font-size:14.5px;letter-spacing:.2px;}
.ks-switch-danger{width:60px;height:34px;}
.ks-switch-danger .ks-switch-track::before{width:26px;height:26px;}
.ks-switch-danger input:checked + .ks-switch-track{background:linear-gradient(135deg,#ff3b5c,#c81e3a)!important;border-color:transparent;}
.ks-switch-danger input:checked + .ks-switch-track::before{transform:translateX(26px);background:#fff;}

/* ══════════════════════════════════════════════════════════
   UNIVERSAL SEARCH — component styles (added)
   Tokens below are *aliased to the host's own CSS variables*
   (--surface, --text, --accent, --border, etc.) instead of
   hardcoded colors. That means the search panel automatically
   matches whichever theme (dark/light) and accent palette
   (amber/indigo/emerald/rose/violet/cyan) is currently active —
   no separate theme to maintain.
   ══════════════════════════════════════════════════════════ */
:root{
  --usp-glass:        color-mix(in srgb, var(--surface) 72%, transparent);
  --usp-glass-strong: color-mix(in srgb, var(--surface) 92%, transparent);
  --usp-border:       var(--border);
  --usp-blur:         20px;

  --usp-text:         var(--text);
  --usp-text-dim:     var(--muted);
  --usp-text-faint:   var(--sub);

  --usp-accent:       var(--accent);
  --usp-accent-soft:  var(--accent-glow);
  --usp-accent-glow:  var(--accent-glow);

  --usp-danger:       #F0507E;

  --usp-radius-panel: 20px;
  --usp-radius-item:  13px;
  --usp-radius-chip:  8px;

  --usp-shadow:       var(--card-shadow);

  --usp-font:         'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --usp-font-mono:    ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;

  --usp-z:            9999;
}

/* Nav search trigger — sits beside the logo, matches the other
   circular nav icon buttons (theme toggle / settings). */
.nav-search-btn{
  position:relative;
  background:none;border:1px solid var(--border);color:var(--text);
  width:36px;height:36px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-left:8px;
  transition:transform .2s,border-color .2s,color .2s;
}
.nav-search-btn svg{width:16px;height:16px;}
.nav-search-btn:hover{border-color:var(--accent);color:var(--accent);transform:scale(1.06);}
.nav-search-btn:active{transform:scale(.94);}
@media(max-width:640px){
  .nav-search-btn{width:32px;height:32px;}
  .nav-search-btn svg{width:15px;height:15px;}
}

.usp-overlay{
  position: fixed; inset: 0; z-index: 9999;
  display: flex; align-items: flex-start; justify-content: center;
  padding-top: 12vh;
}
.usp-overlay[hidden]{ display: none; }

.usp-backdrop{
  position: absolute; inset: 0;
  background: rgba(6, 6, 10, 0.45);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  opacity: 0;
  animation: usp-backdrop-in .22s ease forwards;
}
[data-theme="light"] .usp-backdrop{ background: rgba(30,30,40,0.18); }
@keyframes usp-backdrop-in{ to{ opacity: 1; } }
.usp-overlay.usp-closing .usp-backdrop{ animation: usp-backdrop-out .16s ease forwards; }
@keyframes usp-backdrop-out{ to{ opacity: 0; } }

.usp-panel{
  position: relative;
  width: min(700px, 92vw);
  max-height: 72vh;
  display: flex; flex-direction: column;
  background: var(--usp-glass);
  backdrop-filter: blur(var(--usp-blur)) saturate(1.4);
  -webkit-backdrop-filter: blur(var(--usp-blur)) saturate(1.4);
  border: 1px solid var(--usp-border);
  border-radius: var(--usp-radius-panel);
  box-shadow: var(--usp-shadow);
  overflow: hidden;
  font-family: var(--usp-font);
  color: var(--usp-text);
  opacity: 0;
  transform: translateY(-8px) scale(.97);
  animation: usp-panel-in .22s cubic-bezier(.2,.9,.25,1) forwards;
}
@keyframes usp-panel-in{ to{ opacity: 1; transform: translateY(0) scale(1); } }
.usp-overlay.usp-closing .usp-panel{ animation: usp-panel-out .16s ease forwards; }
@keyframes usp-panel-out{ to{ opacity: 0; transform: translateY(-6px) scale(.98); } }

.usp-input-row{
  display: flex; align-items: center; gap: 12px;
  padding: 16px 20px; border-bottom: 1px solid var(--usp-border); flex: none;
}
.usp-input-row svg.usp-search-icon{ width: 20px; height: 20px; flex: none; color: var(--usp-text-faint); transition: color .15s; }
.usp-input-row:focus-within svg.usp-search-icon{ color: var(--usp-accent); }
.usp-input{
  flex: 1; border: none; outline: none; background: transparent;
  font-family: var(--usp-font); font-size: 17px; font-weight: 500;
  color: var(--usp-text); caret-color: var(--usp-accent);
}
.usp-input::placeholder{ color: var(--usp-text-faint); font-weight: 400; }
.usp-input-row kbd.usp-esc-hint{
  font-family: var(--usp-font-mono); font-size: 11px; color: var(--usp-text-faint);
  border: 1px solid var(--usp-border); padding: 3px 7px; border-radius: 6px; flex: none;
}

.usp-body{ position: relative; overflow-y: auto; overflow-x: hidden; padding: 8px; scroll-behavior: smooth; }
.usp-body::-webkit-scrollbar{ width: 8px; }
.usp-body::-webkit-scrollbar-thumb{ background: rgba(127,127,127,0.25); border-radius: 8px; }

.usp-section-label{
  padding: 10px 12px 6px; font-size: 11px; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase; color: var(--usp-text-faint);
}

.usp-highlight{
  position: absolute; left: 8px; right: 8px; height: 0;
  border-radius: var(--usp-radius-item);
  background: var(--usp-accent-soft);
  border: 1px solid var(--usp-accent-soft);
  pointer-events: none; opacity: 0;
  transition: transform .16s cubic-bezier(.2,.9,.25,1), height .16s cubic-bezier(.2,.9,.25,1), opacity .12s;
  will-change: transform;
}

.usp-list{ position: relative; list-style: none; margin: 0; padding: 0; }
.usp-item{
  position: relative; display: flex; align-items: flex-start; gap: 12px;
  padding: 10px 12px; border-radius: var(--usp-radius-item); cursor: pointer;
  opacity: 0; transform: translateY(4px);
  animation: usp-item-in .18s ease forwards;
  animation-delay: calc(var(--usp-i, 0) * 18ms);
}
@keyframes usp-item-in{ to{ opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce){
  .usp-item{ animation: none; opacity: 1; transform: none; }
  .usp-panel, .usp-backdrop{ animation: none !important; opacity: 1 !important; transform: none !important; }
}

.usp-item-icon{
  flex: none; width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center; font-size: 17px;
  border-radius: 10px; background: rgba(127,127,127,0.12); border: 1px solid var(--usp-border);
}
.usp-item-body{ flex: 1; min-width: 0; }
.usp-item-title-row{ display: flex; align-items: center; gap: 8px; }
.usp-item-title{
  font-size: 14.5px; font-weight: 600; color: var(--usp-text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.usp-item-title mark{ background: transparent; color: var(--usp-accent); font-weight: 700; }
.usp-item-desc{
  font-size: 12.5px; color: var(--usp-text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px;
}
.usp-item-desc mark{ background: transparent; color: var(--usp-text); font-weight: 600; }

.usp-badge{
  flex: none; font-size: 10.5px; font-weight: 600; padding: 3px 8px;
  border-radius: var(--usp-radius-chip); background: rgba(127,127,127,0.12);
  border: 1px solid var(--usp-border); color: var(--usp-text-dim); white-space: nowrap;
}
.usp-item-shortcut{
  flex: none; font-family: var(--usp-font-mono); font-size: 10.5px; color: var(--usp-text-faint);
  border: 1px solid var(--usp-border); border-radius: 6px; padding: 2px 6px; margin-left: 6px;
}
.usp-item[aria-selected="true"] .usp-item-title{ color: var(--usp-text); }
.usp-item[aria-selected="true"] .usp-item-icon{ border-color: var(--usp-accent); }

/* Preview card: first click/Enter shows this, second click/Enter opens */
.usp-item{ flex-wrap: wrap; }
.usp-item-preview-open{ background: rgba(127,127,127,0.08); }
.usp-item-preview{
  flex: 0 0 100%;
  margin-top: 10px; padding-top: 12px;
  border-top: 1px solid var(--usp-border);
  animation: usp-preview-in .16s ease forwards;
}
@keyframes usp-preview-in{ from{ opacity: 0; transform: translateY(-4px); } to{ opacity: 1; transform: translateY(0); } }
.usp-item-preview-desc{
  font-size: 13px; color: var(--usp-text-dim); line-height: 1.5; margin-bottom: 10px;
  white-space: normal;
}
.usp-item-open-btn{
  font-family: var(--usp-font); font-size: 13px; font-weight: 600;
  color: var(--usp-accent); background: var(--usp-accent-soft);
  border: 1px solid var(--usp-accent-soft); border-radius: 999px;
  padding: 7px 14px; cursor: pointer; transition: transform .12s, border-color .15s;
}
.usp-item-open-btn:hover{ border-color: var(--usp-accent); transform: translateY(-1px); }
.usp-item-open-btn:active{ transform: translateY(0); }

.usp-ripple{
  position: absolute; border-radius: 50%; background: var(--usp-accent-soft);
  transform: scale(0); animation: usp-ripple .5s ease-out forwards; pointer-events: none;
}
@keyframes usp-ripple{ to{ transform: scale(1); opacity: 0; } }

.usp-chip-row{ display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 12px 12px; }
.usp-chip{
  display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 6px 12px;
  border-radius: 999px; background: rgba(127,127,127,0.1); border: 1px solid var(--usp-border);
  color: var(--usp-text-dim); cursor: pointer; transition: border-color .15s, color .15s, transform .12s;
}

/* ═══════════════════════════════════════════════════════════════
   HANDWRITING FONT CREATOR — styles (added)
   Namespaced under .hwfc- so nothing here can collide with the
   rest of KS Tech. Reuses the site's existing tokens (--accent,
   --surface, --border, --text, --muted, --card-shadow) so it looks
   native rather than bolted on.
   ═══════════════════════════════════════════════════════════════ */
.hwfc-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:20px;padding:28px;box-shadow:var(--card-shadow);

.hwfc-label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px;}
.hwfc-hint{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.6;}
.hwfc-privacy{text-align:center;color:var(--muted);font-size:13px;margin-top:22px;}
.hwfc-progress-note{

  font-size:13px;color:var(--text);
}

/* ── letter / character collection ── */
.hwfc-collect{max-width:520px;text-align:center;}
.hwfc-progressbar{
  width:100%;height:8px;border-radius:6px;background:var(--surface2);
  overflow:hidden;margin:6px 0 10px;
}
.hwfc-progressbar-fill{
  height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));

}
.hwfc-counter{color:var(--muted);font-size:13px;margin-bottom:6px;}
.hwfc-big-letter{
  font-family:'Syne',sans-serif;font-weight:800;font-size:3.2rem;

}
.hwfc-canvas-wrap{
  position:relative;width:100%;max-width:420px;aspect-ratio:1/1;
  margin:0 auto;border-radius:20px;overflow:hidden;

.hwfc-tool-btn{

.hwfc-chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.hwfc-chip{
  min-width:34px;height:34px;padding:0 8px;border-radius:10px;

}

/* ── review ── */
.hwfc-review-list{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:2px;}

<script>
/* ── CANVAS BACKGROUND (dark=stars, light=geometric) ── */
const canvas=document.getElementById('stars'),ctx=canvas.getContext('2d');
function rsz(){canvas.width=innerWidth;canvas.height=innerHeight;}rsz();
addEventListener('resize',rsz);

/* Dark mode — twinkling stars */
const stars=Array.from({length:180},()=>({
  x:Math.random(),y:Math.random(),
  r:Math.random()*1.5+.3,a:Math.random()
}));

/* Light mode — floating rings + golden particles */
const rings=Array.from({length:7},(_,i)=>({
  x:Math.random()*0.9+0.05,
  y:Math.random()*0.9+0.05,
  r:80+Math.random()*120,
  speed:0.00015+Math.random()*0.0002,
  phase:Math.random()*Math.PI*2,
  rot:Math.random()*Math.PI*2,
  rotSpeed:(Math.random()-0.5)*0.003,
  sides:i%2===0?6:0,   /* hexagon or circle */
  drift:{x:(Math.random()-0.5)*0.00008,y:(Math.random()-0.5)*0.00008}
}));

const particles=Array.from({length:55},()=>({
  x:Math.random(),y:Math.random(),
  vx:(Math.random()-0.5)*0.00018,
  vy:(Math.random()-0.5)*0.00018,
  r:Math.random()*2+0.8,
  a:Math.random()*0.5+0.1,
  pulse:Math.random()*Math.PI*2,
  pulseSpeed:0.02+Math.random()*0.02
}));

function hexPath(cx,cy,r,rot){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=rot+(Math.PI/3)*i;
    i===0?ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a))
         :ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
  }
  ctx.closePath();
}

function isLight(){return document.documentElement.getAttribute('data-theme')==='light';}

function drawBg(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const W=canvas.width,H=canvas.height;

  if(!isLight()){
    /* ── DARK: twinkling stars ── */
    stars.forEach(s=>{
      s.a+=.003*(Math.random()>.5?1:-1);
      s.a=Math.max(.1,Math.min(.9,s.a));
      ctx.globalAlpha=s.a;ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fill();
    });
  } else {
    /* ── LIGHT: geometric rings + particles ── */

    /* 1. Soft radial gradient blobs in background */
    const blobs=[
      {x:0.15,y:0.2, r:280, c:'rgba(245,166,35,0.06)'},
      {x:0.85,y:0.75,r:320, c:'rgba(100,120,255,0.05)'},
      {x:0.5, y:0.9, r:250, c:'rgba(245,166,35,0.04)'},
    ];
    blobs.forEach(b=>{
      const g=ctx.createRadialGradient(b.x*W,b.y*H,0,b.x*W,b.y*H,b.r);
      g.addColorStop(0,b.c);g.addColorStop(1,'transparent');
      ctx.globalAlpha=1;ctx.fillStyle=g;
      ctx.fillRect(0,0,W,H);
    });

    /* 2. Floating hexagons and circles (rings) */
    rings.forEach(ring=>{
      ring.phase+=ring.speed;
      ring.rot+=ring.rotSpeed;
      ring.x+=ring.drift.x; ring.y+=ring.drift.y;
      if(ring.x<-0.1)ring.x=1.1; if(ring.x>1.1)ring.x=-0.1;
      if(ring.y<-0.1)ring.y=1.1; if(ring.y>1.1)ring.y=-0.1;

      const pulse=Math.sin(ring.phase)*0.18+0.82;
      const cx=ring.x*W, cy=ring.y*H, r=ring.r*pulse;
      const alpha=0.07+Math.sin(ring.phase)*0.04;

      ctx.globalAlpha=alpha;
      ctx.strokeStyle='#F5A623';
      ctx.lineWidth=1.5;

      if(ring.sides===6){
        hexPath(cx,cy,r,ring.rot);
        ctx.stroke();
        /* inner smaller hex */
        ctx.globalAlpha=alpha*0.5;
        hexPath(cx,cy,r*0.6,ring.rot+0.3);
        ctx.stroke();
      } else {
        ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
        ctx.globalAlpha=alpha*0.4;
        ctx.beginPath();ctx.arc(cx,cy,r*0.55,0,Math.PI*2);ctx.stroke();
      }

      /* connecting dot at center */
      ctx.globalAlpha=alpha*0.8;
      ctx.fillStyle='#F5A623';
      ctx.beginPath();ctx.arc(cx,cy,2,0,Math.PI*2);ctx.fill();
    });

    /* 3. Golden floating particles */
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0)p.x=1; if(p.x>1)p.x=0;
      if(p.y<0)p.y=1; if(p.y>1)p.y=0;
      p.pulse+=p.pulseSpeed;
      const a=p.a*(0.7+Math.sin(p.pulse)*0.3);
      ctx.globalAlpha=a;
      ctx.fillStyle='#E8860A';
      ctx.beginPath();ctx.arc(p.x*W,p.y*H,p.r,0,Math.PI*2);ctx.fill();
    });

    /* 4. Subtle grid lines */
    ctx.globalAlpha=0.025;
    ctx.strokeStyle='#F5A623';
    ctx.lineWidth=0.8;
    const gridSize=80;
    for(let x=0;x<W;x+=gridSize){
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
    }
    for(let y=0;y<H;y+=gridSize){
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    }
  }

  ctx.globalAlpha=1;
  requestAnimationFrame(drawBg);
}
drawBg();

}

/* ── ROUTER ── */
const appEl=document.getElementById('app');
function go(page){
  curPage=page;
  if(communityUnsub){ communityUnsub(); communityUnsub=null; }
  communityUnsubAllReplies();
  adminUnsubAll(); // (added) tear down any live admin-panel listeners when leaving the page
  // Visiting a tool's own page again counts as "checking on it" — clear its
  // pill-hidden flag so the pill reappears the next time you navigate away.
  if(page==='stopwatch') swPillHidden=false;
  if(page==='countdown') cdPillHidden=false;
  // Clear ALL app timers to prevent background leaks
  clearInterval(ageTimer);
  clearTimeout(dayFinderTimer);
  clearInterval(snakeLoop);
  clearInterval(memTimer);
  clearInterval(sudokuInterval); sudokuInterval=null;
  clearInterval(wsInterval); wsInterval=null;
  clearInterval(typingTimer); typingStarted=false; typingDone=false;
  clearTimeout(hwfcSaveTimer); clearTimeout(hwfcTypingHistoryTimer); /* Handwriting Font Creator (added) */
  stopLifeStatsLive();
  // NOTE: stopwatch & countdown timer are intentionally NOT reset here —
  // they keep counting in the background (via timestamps) while you're
  // on another page, and the floating pill shows their live progress.
  clearInterval(swInterval);
  clearInterval(cdInterval);
  // Health timers
  clearInterval(breathInterval); breathInterval=null;
  clearInterval(lungTimer); lungTimer=null; lungRunning=false; lungPaused=false;
  clearInterval(brTimer); brTimer=null; brRunning=false; brPaused=false;
  clearInterval(stressTimer); stressTimer=null; stressRunning=false;
  clearInterval(eyeTimer); eyeTimer=null; eyeRunning=false;
  document.onkeydown=null;
  window.onmouseup=null;
  appEl.innerHTML='';
  if(isPageBlocked(page)){
    renderFeatureDisabledPage(page);
    injectHelpButton(page);
    if(seriousMode)stripEmojiInNode(appEl);
    window.scrollTo({top:0,behavior:'smooth'});
    applyFeatureFlagUI();
    return;
  }
  if(page==='home') renderHome();
  else if(page==='apps') renderAppList();
  else if(page==='games') renderGames();
  else if(page==='ttt') renderTTT();
  else if(page==='g2048') renderG2048();
  else if(page==='memory') renderMemory();
  else if(page==='snake') renderSnake();
  else if(page==='sudoku') renderSudoku();
  else if(page==='wordsearch') renderWordSearch();
  else if(page==='health') renderHealth();
  else if(page==='fun') renderFun();
  else if(page==='lifestats') renderLifeStats();
  else if(page==='science') renderScience();
  else if(page==='services') renderServices();
  else if(page==='pdftools') renderPdfTools();
  else if(page==='community') renderCommunity();
  else if(page==='breath') renderBreath();
  else if(page==='lunghold') renderLungHold();
  else if(page==='breathrate') renderBreathRate();
  else if(page==='heartrate') renderHeartRate();
  else if(page==='heartzone') renderHeartZone();
  else if(page==='stress') renderStress();
  else if(page==='eyetimer') renderEyeTimer();
  else if(page==='water') renderWater();
  else if(page==='cycle') renderCycleTracker();
  else if(page==='planetweight') renderPlanetWeight();
  else if(page==='agemars') renderAgeMars();
  else if(page==='moonphase') renderMoonPhase();
  else if(page==='whatif') renderWhatIf();
  else if(page==='handwritingfont') renderHandwritingFont();
  else if(page==='stopwatch') renderStopwatch();
  else if(page==='countdown') renderCountdown();
  else if(page==='about') renderAbout();
  else if(page==='auth') renderAuth();
  else if(page==='admin') renderAdmin();
  else if(page==='inbox') renderUserInbox();
  else{const a=APPS.find(x=>x.id===page);if(a)a.render();else renderHome();}
  injectHelpButton(page);
  if(seriousMode)stripEmojiInNode(appEl);
  window.scrollTo({top:0,behavior:'smooth'});
  if(page!=='auth') schedulePrefsSave(); /* remember the active section across reloads/devices (added) */
  applyFeatureFlagUI(); /* dim any paused tiles now visible on this page (added) */
}

/* ═══════════════════════ AUTH / ACCOUNT SYSTEM (added) ═══════════════════════ */
var currentUser=null;      // set by onAuthStateChanged in the Firebase module script
var authReady=false;
var authMode='signin';     // 'signin' | 'signup'
var authBusy=false;
var authMsg=null;          // {type:'error'|'success', text:'...'}

function initialsOf(user){
  if(!user)return '?';
  var n=user.displayName||user.email||'?';
  var parts=n.trim().split(/\s+/);
  if(parts.length>1) return (parts[0][0]+parts[1][0]).toUpperCase();
  return n[0].toUpperCase();
}

function ksNavAccountClick(){
  if(currentUser){ openSettings(); goSettingsView('account'); }
  else{ go('auth'); }
}

function updateNavAuthUI(){
  var d=document.getElementById('navAuthSlotDesktop');
  var m=document.getElementById('navAuthSlotMobile');
  var mobileLabel=document.getElementById('navMobileAccountLabel');
  var html;
  if(currentUser){
    var pic=currentUser.photoDataUrl;
    var icons='';
    // Inbox bell (added) — visible to any signed-in user, badges the unread count.
    icons+='<button class="nav-icon-btn" onclick="go(\'inbox\')" title="Messages" aria-label="Messages">📥'
      +(userUnreadCount>0?'<span class="nav-icon-badge">'+(userUnreadCount>9?'9+':userUnreadCount)+'</span>':'')
      +'</button>';
    // Admin shield (added) — UX-only convenience link; real access control is enforced by
    // Firestore rules (isAdmin()) on every read/write, not by whether this button is shown.
    if(communityIsAdmin()){
      icons+='<button class="nav-icon-btn" onclick="go(\'admin\')" title="Admin dashboard" aria-label="Admin dashboard">🛡️</button>';
    }
    html='<span class="nav-icon-cluster">'+icons+'</span>'
      +'<button class="nav-avatar-btn" onclick="ksNavAccountClick()" title="Account">'
      +(pic?'<img src="'+pic+'" alt="Profile">':initialsOf(currentUser))
      +'</button>';
    if(mobileLabel) mobileLabel.textContent=currentUser.displayName||currentUser.email||'Account';
  }else{
    html='<button class="nav-auth-btn" onclick="go(\'auth\')">Sign In</button>';
    if(mobileLabel) mobileLabel.textContent='Sign In / Account';
  }
  if(d) d.innerHTML=html;
  if(m) m.innerHTML=html;
}

/* Called by the Firebase module script whenever auth state changes */
function onKsAuthStateChanged(user){
  var justSignedIn = !currentUser && user;
  currentUser=user;
  authReady=true;
  authBusy=false;
  startLiveFeatureFlags(); // (added) begin listening for admin pauses as soon as Firebase is ready
  startLiveAboutPhoto(); // (added) begin listening for the admin's About Me photo as soon as Firebase is ready
  ksSetMaintenanceMode(liveFeatureFlags['app_maintenance']===true); // (added) admin status may have just changed
  if(user){ startUserInboxListener(); } else { stopUserInboxListener(); } // (added)
  updateNavAuthUI();
  var navigated=false;
  if(justSignedIn){
    /* Pull this account's saved appearance/settings/last-section from the cloud (e.g. on a new device);
       if the account has none yet, push what's currently active (from localStorage/defaults)
       up so it's backed up going forward. (added) */
    if(user.prefs){
      applyPrefs(user.prefs);
      savePrefsLocal();
      if(user.prefs.lastPage && user.prefs.lastPage!==curPage){ go(user.prefs.lastPage); navigated=true; }
      renderSettingsPanel();
    }else if(window.KSFirebase && window.KSFirebase.savePrefs){
      window.KSFirebase.savePrefs(collectPrefs()).catch(function(){});
    }
  }
  if(!navigated && curPage==='auth' && user){ go('home'); navigated=true; }
  if(document.getElementById('settingsDrawer') && document.getElementById('settingsDrawer').classList.contains('open')){
    if(settingsView==='menu' || settingsView==='account') renderSettingsPanel();
  }
  if(curPage==='auth') renderAuth();
  if(!navigated && curPage==='community') renderCommunity(); // refresh composer visibility after sign-in/out (added)
}

function ksFriendlyAuthError(err){
  var code=(err&&err.code)||'';
  var map={
    'auth/invalid-email':'That email address doesn\'t look right.',
    'auth/user-disabled':'This account has been disabled.',
    'auth/user-not-found':'No account found with that email. Try signing up instead.',
    'auth/wrong-password':'Incorrect password. Please try again.',
    'auth/invalid-credential':'Incorrect email or password.',
    'auth/email-already-in-use':'An account already exists with that email. Try signing in instead.',
    'auth/weak-password':'Please choose a password with at least 6 characters.',
    'auth/too-many-requests':'Too many attempts. Please wait a moment and try again.',
    'auth/popup-closed-by-user':'Google sign-in was closed before finishing.',
    'auth/network-request-failed':'Network error — please check your connection and try again.',
    'permission-denied':'Your account was created, but saving your profile was blocked by the database\'s security rules. This needs a one-time fix in the Firebase Console (Firestore → Rules).'
  };
  return map[code] || (err&&err.message ? err.message.replace('Firebase: ','').replace(/\s*\(auth\/[^)]+\)\.?/,'') : 'Something went wrong. Please try again.');
}

function ksSetAuthMode(mode){
  authMode=mode; authMsg=null; renderAuth();
}

function ksGoogleSignInClick(){
  if(!window.KSFirebase){ authMsg={type:'error',text:'Still connecting — please try again in a moment.'}; renderAuth(); return; }
  authBusy=true; authMsg=null; renderAuth();
  window.KSFirebase.googleSignIn().then(function(){
    authBusy=false;
  }).catch(function(err){
    authBusy=false;
    authMsg={type:'error',text:ksFriendlyAuthError(err)};
    renderAuth();
  });
}

function ksEmailFormSubmit(e){
  if(e&&e.preventDefault)e.preventDefault();
  if(!window.KSFirebase){ authMsg={type:'error',text:'Still connecting — please try again in a moment.'}; renderAuth(); return false; }
  var email=(document.getElementById('authEmail')||{}).value||'';
  var pw=(document.getElementById('authPassword')||{}).value||'';
  email=email.trim();
  authMsg=null;
  if(!email || !pw){ authMsg={type:'error',text:'Please fill in both fields.'}; renderAuth(); return false; }
  authBusy=true; renderAuth();
  if(authMode==='signup'){
    var name=((document.getElementById('authName')||{}).value||'').trim();
    if(pw.length<6){ authBusy=false; authMsg={type:'error',text:'Please choose a password with at least 6 characters.'}; renderAuth(); return false; }
    window.KSFirebase.emailSignUp(email,pw,name).then(function(){
      authBusy=false;
    }).catch(function(err){
      authBusy=false; authMsg={type:'error',text:ksFriendlyAuthError(err)}; renderAuth();
    });
  }else{
    window.KSFirebase.emailSignIn(email,pw).then(function(){
      authBusy=false;
    }).catch(function(err){
      authBusy=false; authMsg={type:'error',text:ksFriendlyAuthError(err)}; renderAuth();
    });
  }
  return false;
}

function ksForgotPassword(){
  var email=((document.getElementById('authEmail')||{}).value||'').trim();
  if(!email){ authMsg={type:'error',text:'Enter your email above first, then tap "Forgot password?" again.'}; renderAuth(); return; }
  if(!window.KSFirebase){ authMsg={type:'error',text:'Still connecting — please try again in a moment.'}; renderAuth(); return; }
  window.KSFirebase.sendReset(email).then(function(){
    authMsg={type:'success',text:'Password reset email sent to '+email+'. Check your inbox.'};
    renderAuth();
  }).catch(function(err){
    authMsg={type:'error',text:ksFriendlyAuthError(err)};
    renderAuth();
  });
}

function renderAuth(){
  if(currentUser){ go('home'); return; }
  var isSignup=authMode==='signup';
  appEl.innerHTML=`
  <div class='auth-wrap'>
    <div class='back-row'><button class='back-btn' onclick="go('home')">← Back</button></div>
    <div class='auth-card'>
      <h2>${isSignup?'Create your account':'Welcome back'}</h2>
      <p class='subtitle'>${isSignup?'Sign up to save your account and settings across devices.':'Sign in to access your KS Tech account.'}</p>
      <div class='auth-tab-row'>
        <button class='auth-tab${!isSignup?' active':''}' onclick="ksSetAuthMode('signin')">Sign In</button>
        <button class='auth-tab${isSignup?' active':''}' onclick="ksSetAuthMode('signup')">Sign Up</button>
      </div>

/* Resizes/compresses an image file client-side into a small square JPEG data URL
   (profile pictures are saved directly in Firestore, so they need to stay small —
   well under Firestore's 1MB-per-document limit). */
function ksCompressImageToDataUrl(file,maxSize,quality){
  return new Promise(function(resolve,reject){
    var img=new Image();
    var reader=new FileReader();
    reader.onerror=function(){reject(new Error('Could not read that file.'));};
    reader.onload=function(e){
      img.onerror=function(){reject(new Error('Could not read that image.'));};
      img.onload=function(){
        var side=Math.min(img.width,img.height);
        var sx=(img.width-side)/2, sy=(img.height-side)/2;
        var canvas=document.createElement('canvas');
        canvas.width=maxSize; canvas.height=maxSize;
        var ctx=canvas.getContext('2d');
        ctx.drawImage(img,sx,sy,side,side,0,0,maxSize,maxSize);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function ksProfilePicSelected(input){
  var file=input.files&&input.files[0];
  if(!file)return;
  if(!window.KSFirebase){ authMsg={type:'error',text:'Still connecting — please try again in a moment.'}; renderSettingsPanel(); return; }
  if(!file.type||file.type.indexOf('image/')!==0){ authMsg={type:'error',text:'Please choose an image file.'}; renderSettingsPanel(); return; }
  if(file.size>15*1024*1024){ authMsg={type:'error',text:'Please choose an image under 15MB.'}; renderSettingsPanel(); return; }
  authBusy=true; authMsg=null; renderSettingsPanel();
  ksCompressImageToDataUrl(file,200,0.72).then(function(dataUrl){
    var preview=document.getElementById('accountAvatarPreview');
    if(preview) preview.innerHTML='<img src="'+dataUrl+'" alt="Profile picture">';
    return window.KSFirebase.saveProfilePic(dataUrl);
  }).then(function(){
    authBusy=false; authMsg={type:'success',text:'Profile picture updated.'};
    renderSettingsPanel(); updateNavAuthUI();
  }).catch(function(err){
    authBusy=false; authMsg={type:'error',text:ksFriendlyAuthError(err)};
    renderSettingsPanel();
  });
}

// Lets the site admin replace the "About Me" photo on the home page without touching
// any code. Only visible to admins (communityIsAdmin()), and the write is enforced
// server-side by Firestore rules (isAdmin() on siteConfig/about) either way. (added)
function aboutPhotoSelected(input){
  var file=input.files&&input.files[0];
  if(!file)return;
  if(!window.KSFirebase||!window.KSFirebase.saveAboutPhoto){ alert('Still connecting — please try again in a moment.'); return; }
  if(!file.type||file.type.indexOf('image/')!==0){ alert('Please choose an image file.'); return; }
  if(file.size>15*1024*1024){ alert('Please choose an image under 15MB.'); return; }
  ksCompressImageToDataUrl(file,500,0.78).then(function(dataUrl){
    liveAboutPhoto=dataUrl; renderHome(); // reflect it instantly while the save goes through
    return window.KSFirebase.saveAboutPhoto(dataUrl);
  }).catch(function(err){
    alert('Could not update the photo: '+(err&&err.message?err.message:'please try again.'));
  });
}

var liveFeatureFlags={};        // live cache of appConfig/features, kept current site-wide
var liveFlagsUnsubGlobal=null;

function startLiveFeatureFlags(){
  if(liveFlagsStarted) return;
  if(!window.KSFirebase || !window.KSFirebase.subscribeFeatureFlags) return;
  liveFlagsStarted=true;
  liveFlagsUnsubGlobal=window.KSFirebase.subscribeFeatureFlags(function(flags,err){

/* ── EMERGENCY SITE-WIDE MAINTENANCE MODE (added) ──
   Flag key 'app_maintenance' lives in the same appConfig/features doc as
   everything else, but uses the OPPOSITE default from every other flag here:
   it's off unless explicitly set to true (every other flag is on unless
   explicitly false). Admins always keep normal access — they get a small
   red banner instead of the overlay, so they can never lock themselves out. */
function ksBuildMaintenanceOverlay(){
  if(document.getElementById('ksMaintenanceOverlay')) return;
  var el=document.createElement('div');
  el.id='ksMaintenanceOverlay';
  el.innerHTML=
      "<div class='ksm-logo'>⚡ <span>KS Tech</span></div>"

  document.body.appendChild(banner);
}
function ksSetMaintenanceMode(active){
  ksBuildMaintenanceOverlay();
  var overlay=document.getElementById('ksMaintenanceOverlay');
  var banner=document.getElementById('ksMaintenanceAdminBanner');
  var isAdminNow = typeof communityIsAdmin==='function' && communityIsAdmin();
  if(active && !isAdminNow){
    if(overlay) overlay.classList.add('show');
    if(banner) banner.classList.remove('show');
    document.body.style.overflow='hidden';
  } else if(active && isAdminNow){
    if(overlay) overlay.classList.remove('show');
    if(banner) banner.classList.add('show');
    document.body.style.overflow='';
  } else {
    if(overlay) overlay.classList.remove('show');
    if(banner) banner.classList.remove('show');
    document.body.style.overflow='';
  }
}

// mobile menu, home tiles, games/health grids, apps list) — purely visual;
// the real block happens in go() itself, so this can't be bypassed by CSS.
function applyFeatureFlagUI(){
  document.querySelectorAll('[onclick]').forEach(function(n){
    var oc=n.getAttribute('onclick')||'';
    var m=oc.match(/go\(['"]([a-zA-Z0-9_]+)['"]\)/);
    if(!m || !FEATURE_PAGE_MAP.hasOwnProperty(m[1])) return;
    var blocked=isPageBlocked(m[1]);
    n.classList.toggle('feature-paused', blocked);
    var tag=n.querySelector('.feature-paused-tag');
    if(blocked && !tag){
      tag=document.createElement('span');
      tag.className='feature-paused-tag';
      tag.textContent='Paused';
      n.appendChild(tag);
    }else if(!blocked && tag){ tag.remove(); }
  });
}

function filterApps(query){
  const q = query.toLowerCase().trim();
  const cards = document.querySelectorAll('#appsGrid .app-card');
  let visible = 0;
  cards.forEach(card => {
    const name = card.dataset.name || '';
    const desc = card.dataset.desc || '';
    const match = !q || name.includes(q) || desc.includes(q);
    card.style.display = match ? '' : 'none';
    if(match) visible++;
  });
  const noMsg = document.getElementById('noAppsMsg');
  if(noMsg) noMsg.style.display = visible === 0 ? 'block' : 'none';
}

function validateDobYY(el){
  const v=parseInt(el.value);
  const maxY=new Date().getFullYear();
  const helpEl=document.getElementById('dobYYHelp');
  if(el.value===''){ el.classList.remove('err'); helpEl.style.display='none'; return; }
  if(isNaN(v)||v<1||v>maxY){ el.classList.add('err'); helpEl.textContent='Year must be between 1 and '+maxY; helpEl.style.display='block'; }
  else{ el.classList.remove('err'); helpEl.style.display='none'; }
}
function validateDobField(el, min, max){
  const v=parseInt(el.value);
  const helpId=el.id+'Help';
  const helpEl=document.getElementById(helpId);
  if(el.value===''){ el.classList.remove('err'); if(helpEl)helpEl.style.display='none'; return; }
  if(isNaN(v)||v<min||v>max){ el.classList.add('err'); if(helpEl)helpEl.style.display='block'; }
  else{ el.classList.remove('err'); if(helpEl)helpEl.style.display='none'; }
}
function validateTargetAge(el){
  const v=parseInt(el.value);
  const helpEl=document.getElementById('targetAgeHelp');
  if(el.value===''){ el.classList.remove('err'); helpEl.style.display='none'; return; }
  if(isNaN(v)||v<1||v>150){ el.classList.add('err'); helpEl.style.display='block'; }
  else{ el.classList.remove('err'); helpEl.style.display='none'; }
}
function parseDOBParts(){
  const dd=+dobDD.value,mm=+dobMM.value,yy=+dobYY.value;
  if(!dd||!mm||!yy||dd<1||dd>31||mm<1||mm>12||yy<1){
    dobHelp.style.display='block';
    [dobDD,dobMM,dobYY].forEach(i=>i.classList.add('err'));return null;
  }
  // Use setFullYear to correctly handle years 1-99 (JS Date quirk)
  const test=new Date(0);
  test.setFullYear(yy, mm-1, dd);
  if(test.getFullYear()!==yy||test.getMonth()!==mm-1||test.getDate()!==dd){
    dobHelp.style.display='block';
    [dobDD,dobMM,dobYY].forEach(i=>i.classList.add('err'));return null;
  }
  dobHelp.style.display='none';[dobDD,dobMM,dobYY].forEach(i=>i.classList.remove('err'));
  return test;
}
function ageBreakdown(ms){
  let diff=Math.abs(ms);
  const y=Math.floor(diff/31557600000);diff-=y*31557600000;
  const mo=Math.floor(diff/2629800000);diff-=mo*2629800000;
  const d=Math.floor(diff/86400000);diff-=d*86400000;
  const h=Math.floor(diff/3600000);diff-=h*3600000;
  const mi=Math.floor(diff/60000);diff-=mi*60000;
  const s=Math.floor(diff/1000);
  return {y,mo,d,h,mi,s};
}
function fmtAge(b){
  const u=(n,label)=>`<span style='font-family:Rajdhani, sans-serif;font-weight:600'>${n}</span><span style='font-family:Rajdhani, sans-serif;font-size:0.65em;font-weight:400;opacity:0.75;margin-left:3px'>${label}</span>`;
  return `${u(b.y,'yrs')} &nbsp; ${u(b.mo,'Mo')} &nbsp; ${u(b.d,'days')} &nbsp; ${u(b.h,'hrs')} &nbsp; ${u(b.mi,'min')} &nbsp; ${u(b.s,'sec')}`;
}
function fmtDateFull(date){
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return days[date.getDay()]+', '+date.getDate()+' '+months[date.getMonth()]+' '+date.getFullYear();
}

function startAgeCalc(){
  clearInterval(ageTimer);
  const dob=parseDOBParts();if(!dob)return;
  const name=uname.value||'You';
  const target=parseFloat(targetAge.value);

  // ── Feature 1: Age on specific date ──
  let specResult='';
  const sdd=parseInt(document.getElementById('specDD').value);
  const smm=parseInt(document.getElementById('specMM').value);
  const syy=parseInt(document.getElementById('specYY').value);
  const specHelp=document.getElementById('specHelp');
  const hasSpec=document.getElementById('specDD').value||document.getElementById('specMM').value||document.getElementById('specYY').value;
  if(hasSpec){
    if(!sdd||!smm||!syy||sdd<1||sdd>31||smm<1||smm>12||syy<1){
      specHelp.style.display='block';return;
    }
    const specDate=new Date(syy,smm-1,sdd);
    if(specDate.getFullYear()!==syy||specDate.getMonth()!==smm-1||specDate.getDate()!==sdd){
      specHelp.style.display='block';return;
    }
    specHelp.style.display='none';
    if(specDate<dob){
      specResult=`<div style='margin-top:14px;padding-top:14px;border-top:1px solid var(--border)'>
        <p style='color:var(--muted);font-size:13px'>📅 On ${fmtDateFull(specDate)}</p>
        <p style='color:#f87171;font-size:13px'>⚠️ This date is before your date of birth.</p>
      </div>`;
    } else {
      const diff=specDate-dob;
      const b=ageBreakdown(diff);
      const isFuture=specDate>new Date();
      specResult=`<div style='margin-top:14px;padding-top:14px;border-top:1px solid var(--border)'>
        <p style='color:var(--muted);font-size:13px'>📅 ${isFuture?'On':'On'} ${fmtDateFull(specDate)} ${isFuture?'you will be':'you were'}:</p>
        <strong style='display:block;margin-top:4px'>${fmtAge(b)}</strong>
      </div>`;
    }
  } else { specHelp.style.display='none'; }

  // ── Feature 2: Date of milestone ──
  let msResult='';
  const msY=parseInt(document.getElementById('msYears').value)||0;
  const msM=parseInt(document.getElementById('msMonths').value)||0;
  const msD=parseInt(document.getElementById('msDays').value)||0;
  const msHelp=document.getElementById('msHelp');
  const hasMs=document.getElementById('msYears').value||document.getElementById('msMonths').value||document.getElementById('msDays').value;
  if(hasMs){
    if(msY===0&&msM===0&&msD===0){msHelp.style.display='block';return;}
    msHelp.style.display='none';
    const msDate=new Date(dob);
    msDate.setFullYear(msDate.getFullYear()+msY);
    msDate.setMonth(msDate.getMonth()+msM);
    msDate.setDate(msDate.getDate()+msD);
    const isFuture=msDate>new Date();
    const timeAgo=isFuture?'':Math.floor((new Date()-msDate)/86400000)+' days ago';
    msResult=`<div style='margin-top:14px;padding-top:14px;border-top:1px solid var(--border)'>
      <p style='color:var(--muted);font-size:13px'>🎯 You ${isFuture?'will reach':'reached'} ${msY>0?msY+' yrs ':''} ${msM>0?msM+' Mo ':''} ${msD>0?msD+' days':''}on:</p>
      <strong style='display:block;margin-top:4px;color:var(--accent)'>${fmtDateFull(msDate)}</strong>
      ${!isFuture?`<p style='font-size:12px;color:var(--muted);margin-top:4px'>That was ${timeAgo}.</p>`:`<p style='font-size:12px;color:#4ade80;margin-top:4px'>That is in the future! 🌟</p>`}
    </div>`;
  } else { msHelp.style.display='none'; }

  // ── Build static shell once (no flicker) ──
  let shell=`<div class='result-box'>
    <p>${name}, your exact age right now is:</p>
    <strong id='ageDisplay' style='display:block;line-height:1.8'></strong>`;
  if(!isNaN(target)) shell+=`<div id='targetSection' style='margin-top:12px'></div>`;
  shell+=specResult+msResult+`</div>`;
  ageResult.innerHTML=shell;

  function tick(){
    const now=new Date();
    const b=ageBreakdown(now-dob);
    const ageEl=document.getElementById('ageDisplay');
    if(ageEl) ageEl.innerHTML=fmtAge(b);
    if(!isNaN(target)){
      const tEl=document.getElementById('targetSection');if(!tEl)return;
      const remain=target*31557600000-(now-dob);
      if(remain>0){
        const r=ageBreakdown(remain);
        tEl.innerHTML=`<p style='color:var(--muted);font-size:13px;margin-top:4px'>⏳ Time left to age ${target}:</p><strong>${fmtAge(r)}</strong>`;
      }else{
        tEl.innerHTML=`<p style='margin-top:4px'>✅ You already crossed age ${target}!</p>`;
      }
    }
  }
  tick();
  ageTimer=setInterval(tick,1000);
}

function gcd(a,b){return b?gcd(b,a%b):a;}
function lcm(a,b){return a*b/gcd(a,b);}

function calcBmi(){
  let weight=parseFloat(w.value),height=parseFloat(h.value);
  if(!weight||!height){bmiHelp.style.display='block';return;}
  bmiHelp.style.display='none';
  if(wUnit.value==='lb')weight*=0.453592;
  if(hUnit.value==='cm')height/=100;
  if(hUnit.value==='ft')height*=0.3048;
  if(hUnit.value==='in')height*=0.0254;
  const bmi=weight/(height*height);
  let status='',tagClass='';
  if(bmi<18.5){status='Underweight 🔵';tagClass='uw';}
  else if(bmi<25){status='Normal ✅';tagClass='nm';}
  else if(bmi<30){status='Overweight ⚠️';tagClass='ow';}
  else{status='Obese 🔴';tagClass='ob';}
  bmiResult.innerHTML=`<div class='result-box reveal'>
    <p>Your BMI</p><strong>${bmi.toFixed(2)}</strong>
    <p style='margin-top:10px'>WHO Status: <span class='tag ${tagClass}'>${status}</span></p>
  </div>`;
}

const TYPING_TEXTS=[
  "The quick brown fox jumps over the lazy dog. Programming is the art of telling another human what one wants the computer to do. Every great developer you know got there by solving problems they were unqualified to solve.",
  "Technology is best when it brings people together. The science of today is the technology of tomorrow. Innovation distinguishes between a leader and a follower. Stay hungry, stay foolish.",

function renderPromptChars(text){
  return text.split('').map((c,i)=>`<span id='tc${i}' style='border-radius:3px'>${c==' '?'&nbsp;':c}</span>`).join('');
}

function onTypingInput(e){
  if(typingDone)return;
  const input=document.getElementById('tpInput');
  const val=input.value;
  const prompt=document.getElementById('tpPrompt');
  const text=prompt.getAttribute('data-text');

  if(!typingStarted&&val.length>0){
    typingStarted=true;
    const startTime=Date.now();
    window._typingStart=startTime;
    typingTimer=setInterval(()=>{
      if(!typingStarted||typingDone){clearInterval(typingTimer);return;}
      const elapsed=Math.floor((Date.now()-window._typingStart)/1000);
      document.getElementById('tpTime').textContent=elapsed;
      const words=val.trim().split(/\s+/).filter(w=>w).length;
      const wpm=elapsed>0?Math.round((words/elapsed)*60):0;
      document.getElementById('tpWpm').textContent=wpm;
    },500);
  }

  // colour each character
  let correct=0;
  for(let i=0;i<text.length;i++){
    const span=document.getElementById('tc'+i);
    if(!span)continue;
    if(i<val.length){
      if(val[i]===text[i]){
        span.style.background='rgba(74,222,128,0.2)';span.style.color='#4ade80';correct++;
      }else{
        span.style.background='rgba(248,113,113,0.2)';span.style.color='#f87171';
      }
    }else{
      span.style.background='';span.style.color='';
    }
  }
  const acc=val.length>0?Math.round((correct/Math.min(val.length,text.length))*100):100;
  document.getElementById('tpAcc').textContent=acc;

  // finished
  if(val.length>=text.length){
    typingDone=true;clearInterval(typingTimer);
    const elapsed=(Date.now()-window._typingStart)/1000;
    const words=text.trim().split(/\s+/).length;
    const wpm=Math.round((words/elapsed)*60);
    const finalAcc=Math.round((correct/text.length)*100);
    let grade='',emoji='';
    if(wpm>=80&&finalAcc>=95){grade='Expert 🏆';emoji='🔥';}
    else if(wpm>=60&&finalAcc>=90){grade='Advanced ⭐';emoji='💪';}
    else if(wpm>=40&&finalAcc>=85){grade='Intermediate 👍';emoji='😊';}
    else if(wpm>=20){grade='Beginner 🌱';emoji='😅';}
    else{grade='Keep Practicing 💡';emoji='🤔';}
    document.getElementById('tpResult').innerHTML=`<div class='result-box reveal' style='text-align:center;margin-top:14px'>
      <div style='font-size:2.5rem;margin-bottom:8px'>${emoji}</div>
      <table class='who-table' style='text-align:left'>
        <tr><td>⚡ WPM</td><td><strong style='color:var(--accent);font-size:1.3rem'>${wpm}</strong></td></tr>
        <tr><td>🎯 Accuracy</td><td><strong style='color:${finalAcc>=90?"#4ade80":"#f87171"}'>${finalAcc}%</strong></td></tr>
        <tr><td>⏱️ Time Taken</td><td><strong>${elapsed.toFixed(1)}s</strong></td></tr>
        <tr><td>📊 Level</td><td><strong>${grade}</strong></td></tr>
      </table>
      <button class='btn btn-primary' style='margin-top:14px;width:100%' onclick='resetTypingTest()'>🔄 Try Again</button>
    </div>`;
  }
}

function resetTypingTest(){
  clearInterval(typingTimer);typingStarted=false;typingDone=false;
  renderTypingTest();
}

function startDayFinder(){

  const test=new Date(year,month-1,day);
  if(test.getFullYear()!==year||test.getMonth()!==month-1||test.getDate()!==day){dfHelp.style.display='block';return;}
  dfForm.style.display='none';dfResult.innerHTML='';
  const loading=document.getElementById('dfLoading');
  const eggsOn=(typeof easterEggs==='undefined')||easterEggs;

  if(eggsOn){
    loading.style.display='flex';
    let i=0;const interval=10000/DAY_PHRASES.length;const phraseEl=document.getElementById('dfPhrase');
    function nextPhrase(){
      if(i<DAY_PHRASES.length){
        phraseEl.style.animation='none';void phraseEl.offsetWidth;
        phraseEl.style.animation='fadeUp .5s ease forwards';
        phraseEl.textContent=DAY_PHRASES[i++];
        dayFinderTimer=setTimeout(nextPhrase,interval);
      }
    }
    nextPhrase();
  }else{
    loading.style.display='none';
  }
  setTimeout(()=>{
    loading.style.display='none';
    const date=new Date(year,month-1,day);
    const prev=new Date(date);prev.setDate(prev.getDate()-1);
    const next=new Date(date);next.setDate(next.getDate()+1);
    dfResult.innerHTML=`<div class='reveal'>
      <div class='day-result-box'>

function setCrit(id,on){const el=document.getElementById(id);on?el.classList.add('met'):el.classList.remove('met');}
function evalPw(val){
  const hasUpper=/[A-Z]/.test(val),hasLower=/[a-z]/.test(val),hasNum=/[0-9]/.test(val),hasSym=/[^A-Za-z0-9]/.test(val),lenOk=val.length>=8,lenLong=val.length>=12;
  setCrit('pc-len',lenOk);setCrit('pc-upper',hasUpper);setCrit('pc-lower',hasLower);setCrit('pc-num',hasNum);setCrit('pc-sym',hasSym);setCrit('pc-long',lenLong);
  let score=0;
  if(val.length>0){
    if(lenOk)score+=20;
    if(hasUpper)score+=15;if(hasLower)score+=15;if(hasNum)score+=20;if(hasSym)score+=20;
    if(lenLong)score+=10;
    if(val.length>=16)score=Math.min(score+5,100);
    // Cap score at 20 if length requirement not met — short passwords can't be strong
    if(!lenOk) score=Math.min(score,15);
  }
  document.getElementById('pwScore').textContent=score;
  let level=0;
  if(val.length>0){if(score<=15)level=1;else if(score<=30)level=2;else if(score<=45)level=3;else if(score<=55)level=4;else if(score<=65)level=5;else if(score<=75)level=6;else if(score<=89)level=7;else level=8;}
  const v=PW_VERDICTS[level];
