<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>KS Tech — Apps by Kiran Sankar</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&family=Rajdhani:wght@400;500;600;700&family=Press+Start+2P&family=Share+Tech+Mono&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* ── TOKENS ── */
:root{
  --accent:#F5A623;
  --accent2:#E8860A;
  --accent-glow:rgba(245,166,35,0.25);
  --indigo:#3D52D5;
  --indigo-soft:#4F64E8;

  /* dark theme */
  --bg:       #0A0C14;
  --bg2:      #0F1220;
  --surface:  #141826;
  --surface2: #1B2035;
  --border:   rgba(255,255,255,0.07);
  --text:     #EDF0FA;
  --muted:    #7A839E;
  --sub:      #4A5168;
  --card-shadow: 0 8px 40px rgba(0,0,0,0.5);
}
[data-theme="light"]{
  --bg:       #F3F5FB;
  --bg2:      #EAECF7;
  --surface:  #FFFFFF;
  --surface2: #F0F2FC;
  --border:   rgba(0,0,0,0.08);
  --text:     #0F1220;
  --muted:    #5A6380;
  --sub:      #9AA0B8;
  --card-shadow: 0 8px 40px rgba(0,0,0,0.08);
}

/* ── COLOR PALETTES (added) — swap the accent only, bg/surface stay dark/light as-is ── */
[data-palette="amber"]{ --accent:#F5A623; --accent2:#E8860A; --accent-glow:rgba(245,166,35,0.25); }
[data-palette="indigo"]{ --accent:#3D52D5; --accent2:#2F3FB0; --accent-glow:rgba(61,82,213,0.25); }
[data-palette="emerald"]{ --accent:#22C58B; --accent2:#189A6C; --accent-glow:rgba(34,197,139,0.25); }
[data-palette="rose"]{ --accent:#F0507E; --accent2:#D33566; --accent-glow:rgba(240,80,126,0.25); }
[data-palette="violet"]{ --accent:#9B6BF2; --accent2:#7E4BD9; --accent-glow:rgba(155,107,242,0.25); }
[data-palette="cyan"]{ --accent:#22B8CF; --accent2:#1592A6; --accent-glow:rgba(34,184,207,0.25); }

/* ── DIFFICULTY / MODE TABS ── */
.calc-tab{
  position:relative;padding:10px 18px;border-radius:12px;
  border:1.5px solid var(--border);
  background:linear-gradient(135deg,var(--surface2),var(--surface));
  color:var(--muted);cursor:pointer;
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;
  transition:all .2s cubic-bezier(.4,0,.2,1);
  box-shadow:0 2px 8px rgba(0,0,0,.3);
  overflow:hidden;
  text-align:center;
  line-height:1.4;
}
.calc-tab:hover{
  border-color:rgba(245,166,35,0.45);
  color:var(--text);
  transform:translateY(-1px);
  box-shadow:0 4px 18px rgba(0,0,0,.4);
}
.calc-tab:active{transform:scale(.94) translateY(0) !important;}
.calc-tab.active{
  background:linear-gradient(135deg,#7a3e00,#3d1f00);
  border-color:var(--accent);
  color:var(--accent);
  box-shadow:0 0 18px rgba(245,166,35,0.28),0 2px 8px rgba(0,0,0,.5);
  font-weight:700;
}
.calc-tab.active::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  border-radius:2px 2px 0 0;
}

/* ── NUMBER FONT ── */
/* Apply Rajdhani to all numeric values site-wide */
.num-font,
.stat-num,
#ageDisplay,
#swDisplay,
#cdDisplay,
.day-big,
.nbr-day,
.score-num,
.verdict-lbl,
.day-date-lbl,
#tpTime, #tpAcc, #tpWpm {
  font-family: 'Rajdhani', sans-serif !important;
  font-weight: 500;
  letter-spacing: -0.5px;
}

/* Target strong tags inside result boxes — where all calculated values appear */
.result-box strong,
.who-table strong,
.day-big,
.nbr-day,
.score-chip .score-num,
#swDisplay,
#cdDisplay,
#tpTime, #tpAcc, #tpWpm {
  font-family: 'Rajdhani', sans-serif !important;
  font-weight: 500;
}

/* ── RESET ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  transition:background .35s,color .35s;
}

/* ── CANVAS ── */
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:1;transition:opacity .35s;}
[data-theme="light"] #stars{opacity:1;}

/* ── NAVBAR ── */
.navbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;height:64px;
  background:rgba(10,12,20,0.75);
  backdrop-filter:blur(18px);
  border-bottom:none;
  transition:background .35s,border-color .35s;
  gap:12px;
}
[data-theme="light"] .navbar{background:rgba(243,245,251,0.85);}

/* Logo */
.nav-logo-wrap{
  display:flex;flex-direction:column;justify-content:center;
  cursor:pointer;gap:1px;flex-shrink:0;
}
.nav-logo{
  font-family:'Syne',sans-serif;font-weight:800;font-size:1.15rem;
  letter-spacing:-0.5px;
  background:linear-gradient(135deg,var(--accent),#FF8C42);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1.2;
}
.nav-logo span{color:var(--text);-webkit-text-fill-color:var(--text);}
.nav-tagline{
  font-size:10px;font-weight:600;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--muted);
  font-family:'DM Sans',sans-serif;opacity:0.65;
}

/* Middle cycling tagline — mobile only */
.nav-marquee-wrap{
  flex:1;overflow:hidden;
  display:none;
  flex-direction:column;align-items:center;justify-content:center;
  position:relative;height:100%;gap:5px;
}
@keyframes cycleTag{
  0%{opacity:0;transform:translateY(5px);}
  12%{opacity:1;transform:translateY(0);}
  80%{opacity:1;transform:translateY(0);}
  92%{opacity:0;transform:translateY(-5px);}
  100%{opacity:0;transform:translateY(-5px);}
}
.nav-marquee-text{
  font-size:10.5px;font-weight:600;letter-spacing:0.8px;
  color:var(--muted);
  font-family:'DM Sans',sans-serif;
  white-space:nowrap;opacity:0;
  text-align:center;
}
.nav-marquee-text.active{animation:cycleTag 3.5s ease forwards;}
/* Glow underline */

/* Desktop nav links */
.nav-right{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;flex-shrink:1;min-width:0;}
.nav-right::-webkit-scrollbar{display:none;}
.nav-link{
  font-size:14px;font-weight:500;color:var(--muted);
  cursor:pointer;padding:6px 10px;border-radius:8px;white-space:nowrap;
  border:none;background:none;
  transition:color .2s,background .2s;
  font-family:'DM Sans',sans-serif;white-space:nowrap;
}
.nav-link:hover{color:var(--text);background:var(--surface2);}

/* Mobile right: grid-dots + theme toggle */
.nav-mobile-right{
  display:none;align-items:center;gap:8px;flex-shrink:0;
}

/* Rounded pill Menu button */
.nav-grid-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:0 14px;height:36px;border-radius:100px;
  background:var(--surface2);border:1px solid var(--border);
  cursor:pointer;flex-shrink:0;
  font-size:13px;font-weight:600;color:var(--muted);
  font-family:'DM Sans',sans-serif;
  transition:background .2s,border-color .2s,color .2s;
  white-space:nowrap;
  order:-1;
}
.nav-grid-btn:hover{background:var(--border);color:var(--text);}
.nav-grid-btn.open{
  background:rgba(61,82,213,0.15);
  border-color:var(--accent);
  color:var(--accent);
}
.nav-grid-btn-icon{font-size:14px;transition:transform .3s;}
.nav-grid-btn.open .nav-grid-btn-icon{transform:rotate(90deg);}

/* Mobile dropdown */
@keyframes dropDown{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
.nav-mobile-menu{
  display:none;
  position:fixed;top:64px;left:0;right:0;z-index:99;
  max-height:calc(100dvh - 64px);
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  background:rgba(10,12,20,0.98);
  backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);
  flex-direction:column;
  padding:6px 12px 24px;
}
[data-theme="light"] .nav-mobile-menu{background:rgba(243,245,251,0.98);}
.nav-mobile-menu.open{display:flex;animation:dropDown .22s ease;}

.nav-mobile-section{
  font-size:10px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--muted);
  padding:14px 14px 5px;opacity:0.55;
  font-family:'DM Sans',sans-serif;
}
.nav-mobile-link{
  display:flex;align-items:center;gap:13px;
  font-size:15px;font-weight:600;color:var(--text);
  cursor:pointer;padding:12px 14px;border-radius:14px;
  border:none;background:none;text-align:left;width:100%;
  font-family:'DM Sans',sans-serif;
  transition:background .15s;
  -webkit-tap-highlight-color:transparent;
}
.nav-mobile-link:active,.nav-mobile-link:hover{background:var(--surface2);}
.nav-mobile-icon{
  width:38px;height:38px;border-radius:10px;
  background:var(--surface2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:1.15rem;flex-shrink:0;
}
.nav-mobile-label{flex:1;}
.nav-mobile-arrow{color:var(--muted);font-size:16px;opacity:0.4;}

.nav-mobile-divider{height:1px;background:var(--border);margin:6px 14px;opacity:0.4;}

.nav-mobile-social{display:flex;gap:10px;padding:8px 14px 4px;}
.nav-mobile-social-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 8px;border-radius:13px;
  background:var(--surface2);border:1px solid var(--border);
  font-size:13px;font-weight:600;color:var(--muted);
  cursor:pointer;font-family:'DM Sans',sans-serif;
  transition:background .15s,color .15s,border-color .15s;
  -webkit-tap-highlight-color:transparent;text-decoration:none;
}
.nav-mobile-social-btn:hover,.nav-mobile-social-btn:active{
  background:rgba(61,82,213,0.15);border-color:var(--accent);color:var(--accent);
}

/* Theme toggle — shared */
.theme-toggle{
  width:72px;height:36px;border-radius:18px;
  background:var(--surface2);border:1px solid var(--border);
  cursor:pointer;position:relative;transition:background .3s;flex-shrink:0;
}
.theme-toggle::after{
  content:'';position:absolute;top:4px;left:4px;
  width:26px;height:26px;border-radius:50%;
  background:var(--accent);transition:transform .3s,background .3s;
  box-shadow:0 0 10px var(--accent-glow);
}
[data-theme="light"] .theme-toggle::after{transform:translateX(36px);}
.theme-icon{font-size:16px;position:absolute;top:50%;transform:translateY(-50%);pointer-events:none;}
.theme-icon.moon{left:8px;}
.theme-icon.sun{right:8px;}

/* Mobile breakpoint */
@media(max-width:640px){
  .navbar{padding:0 16px;gap:8px;}
  .nav-right{display:none;}
  .nav-mobile-right{display:flex;}
  .nav-marquee-wrap{display:flex;}
}

/* ── MAIN ── */
#app{
  position:relative;z-index:1;
  padding-top:64px;
  min-height:100vh;
}

/* ── HOME ── */
.hero{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:calc(100vh - 64px);
  padding:60px 24px 40px;
  text-align:center;
  position:relative;
}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:100px;padding:6px 16px;
  font-size:13px;color:var(--muted);
  margin-bottom:28px;
  animation:fadeUp .6s ease both;
}
.hero-badge span{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);display:inline-block;
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent-glow);}50%{box-shadow:0 0 0 6px transparent;}}

.hero-title{
  font-family:'Syne',sans-serif;
  font-size:clamp(2.8rem,7vw,5.2rem);
  font-weight:800;line-height:1.05;
  letter-spacing:-2px;
  margin-bottom:20px;
  animation:fadeUp .6s .1s ease both;
}
.hero-title .accent{
  background:linear-gradient(135deg,var(--accent) 0%,#FF8C42 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.hero-sub{
  font-size:clamp(1rem,2.5vw,1.2rem);
  color:var(--muted);max-width:520px;
  line-height:1.7;margin-bottom:40px;
  font-weight:400;
  animation:fadeUp .6s .2s ease both;
}
.hero-cta{
  display:flex;flex-wrap:wrap;gap:12px;
  justify-content:center;margin-bottom:60px;
  animation:fadeUp .6s .3s ease both;
}
.btn{
  font-family:'DM Sans',sans-serif;
  font-weight:600;font-size:15px;
  padding:13px 26px;border-radius:12px;
  cursor:pointer;border:none;
  display:inline-flex;align-items:center;gap:8px;
  transition:transform .2s,box-shadow .2s,background .2s;
  text-decoration:none;
}
.btn:active{transform:scale(.97);}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#0A0C14;
  box-shadow:0 4px 20px var(--accent-glow);
}
.btn-primary:hover{box-shadow:0 6px 28px rgba(245,166,35,0.4);transform:translateY(-2px);}
.btn-secondary{
  background:var(--surface);
  color:var(--text);
  border:1px solid var(--border);
}
.btn-secondary:hover{background:var(--surface2);transform:translateY(-2px);}
.btn-ghost{
  background:transparent;color:var(--muted);
  border:1px solid var(--border);
}
.btn-ghost:hover{color:var(--text);border-color:var(--accent);transform:translateY(-2px);}

/* stat strip */
.stat-strip{
  display:flex;flex-wrap:wrap;gap:2px;
  justify-content:center;
  animation:fadeUp .6s .4s ease both;
}
.stat-item{
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:20px 28px;
  text-align:center;min-width:130px;
}
.stat-num{
  font-family:'Syne',sans-serif;
  font-size:1.9rem;font-weight:800;
  background:linear-gradient(135deg,var(--accent),#FF8C42);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.stat-lbl{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:.5px;}

/* features */
.features{
  padding:80px 24px;max-width:1100px;margin:0 auto;
}
.section-label{
  font-size:12px;letter-spacing:3px;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin-bottom:12px;
}
.section-title{
  font-family:'Syne',sans-serif;
  font-size:clamp(1.8rem,4vw,2.8rem);
  font-weight:800;letter-spacing:-1px;
  margin-bottom:48px;line-height:1.15;
}
.feature-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:16px;
}
.feature-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:20px;padding:28px;
  transition:transform .25s,box-shadow .25s,border-color .25s;
  cursor:default;
}
.feature-card:hover{
  transform:translateY(-5px);
  box-shadow:0 16px 40px rgba(0,0,0,.2);
  border-color:rgba(245,166,35,0.3);
}
.feat-icon{
  font-size:2rem;margin-bottom:14px;display:block;
}
.feat-title{
  font-family:'Syne',sans-serif;font-weight:700;
  font-size:1.05rem;margin-bottom:8px;
}
.feat-desc{font-size:14px;color:var(--muted);line-height:1.6;}

/* about section */
.about-section{
  padding:80px 24px;
  background:var(--surface);
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
}
.about-inner{
  max-width:900px;margin:0 auto;
  display:grid;grid-template-columns:1fr 1fr;gap:60px;
  align-items:center;
}
@media(max-width:640px){.about-inner{grid-template-columns:1fr;gap:32px;}}
.about-avatar{
  width:100%;aspect-ratio:1;max-width:280px;
  border-radius:24px;
  background:linear-gradient(135deg,var(--surface2),var(--bg));
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:5rem;margin:0 auto;
}
.about-photo-edit-btn{
  position:absolute;bottom:10px;right:10px;
  width:38px;height:38px;border-radius:50%;
  background:var(--accent,#e8860a);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;border:2px solid var(--surface);
  box-shadow:0 2px 8px rgba(0,0,0,0.25);
}
.about-text h2{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:clamp(1.6rem,3vw,2.2rem);letter-spacing:-1px;
  margin-bottom:14px;
}
.about-text p{font-size:15px;color:var(--muted);line-height:1.8;margin-bottom:18px;}
.about-links{display:flex;gap:10px;flex-wrap:wrap;}

/* contact strip */
.contact-strip{
  padding:60px 24px;
  max-width:700px;margin:0 auto;
  text-align:center;
}
.contact-strip h2{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:clamp(1.6rem,3vw,2.2rem);letter-spacing:-1px;
  margin-bottom:10px;
}
.contact-strip p{color:var(--muted);margin-bottom:24px;font-size:15px;}
.email-chip{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:100px;padding:10px 22px;
  font-size:15px;font-weight:500;color:var(--text);
  text-decoration:none;
  transition:border-color .2s,box-shadow .2s;
}
.email-chip:hover{
  border-color:var(--accent);
  box-shadow:0 0 20px var(--accent-glow);
}
.email-chip .dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--accent);flex-shrink:0;
}

/* footer */
footer{
  background:var(--surface);
  border-top:1px solid var(--border);
  padding:24px;text-align:center;
  font-size:13px;color:var(--muted);
}
footer strong{color:var(--accent);}

/* ── APP LIST ── */
.page-wrap{max-width:800px;margin:0 auto;padding:40px 24px 80px;}
.page-header{
  display:flex;align-items:center;gap:14px;
  margin-bottom:32px;
}
.page-header h2{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:-1px;
}
.apps-grid{display:flex;flex-direction:column;gap:12px;}
.app-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:18px;padding:20px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  cursor:pointer;
  transition:transform .2s,box-shadow .2s,border-color .2s;
}
.app-card:hover{
  transform:translateX(6px);
  box-shadow:0 8px 32px rgba(0,0,0,.15);
  border-color:rgba(245,166,35,0.35);
}
.app-card-left{display:flex;align-items:center;gap:16px;}
.app-icon{
  width:48px;height:48px;border-radius:14px;
  background:linear-gradient(135deg,var(--surface2),var(--bg));
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;flex-shrink:0;
}
.app-name{
  font-family:'Syne',sans-serif;font-weight:700;
  font-size:1rem;margin-bottom:3px;
}
.app-desc{font-size:13px;color:var(--muted);}
.app-arrow{color:var(--accent);font-size:1.2rem;flex-shrink:0;}

/* ── PDF TOOLKIT (added) ── */
.pdf-page-wrap{max-width:1200px;}
.pdf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:20px;}
.pdf-tool-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:18px;padding:18px;
  transition:transform .2s,box-shadow .2s,border-color .2s;
}
.pdf-tool-card:hover{transform:translateY(-4px);box-shadow:var(--card-shadow);border-color:var(--accent);}
.pdf-tool-icon{font-size:1.5rem;margin-bottom:8px;}
.pdf-tool-title{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;margin-bottom:4px;}
.pdf-tool-desc{font-size:12.5px;color:var(--muted);margin-bottom:12px;line-height:1.4;}
.pdf-tool-switch{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.pdf-tool-switch label{
  font-size:11.5px;padding:6px 10px;border-radius:999px;
  border:1px solid var(--border);background:var(--surface2);color:var(--muted);
  display:flex;align-items:center;gap:5px;cursor:pointer;
}
.pdf-tool-switch input{accent-color:var(--accent);}
.pdf-drop{
  border:1.5px dashed var(--border);border-radius:14px;
  padding:16px 10px;text-align:center;color:var(--sub);font-size:12px;
}
.pdf-drop-note{display:none;margin-top:8px;font-size:11.5px;color:var(--accent);}
.pdf-tool-tag{font-size:10px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--sub);display:inline-block;margin-top:2px;border:1px solid var(--border);}

/* ── COMMUNITY (added) ── */
.community-composer{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  padding:18px;margin-bottom:22px;
}
.community-composer textarea{
  width:100%;min-height:70px;resize:vertical;padding:12px 14px;
  border-radius:12px;border:1.5px solid var(--border);
  background:var(--bg2);color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:14.5px;box-sizing:border-box;outline:none;
}
.community-composer textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
.community-composer-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px;}
.community-char-count{font-size:11.5px;color:var(--sub);}
.community-signin-prompt{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  padding:24px;text-align:center;margin-bottom:22px;
}
.community-signin-prompt p{color:var(--muted);font-size:14px;margin-bottom:14px;}
.community-feed{display:flex;flex-direction:column;gap:12px;}
.community-post{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:16px 18px;display:flex;gap:12px;
}
.community-post.pinned{
  border-color:var(--accent);
  background:linear-gradient(var(--accent-glow),var(--accent-glow)),var(--surface);
}
.community-pin-badge{
  display:inline-block;padding:1px 8px;margin-left:2px;
  font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;letter-spacing:.03em;
  color:var(--accent);background:var(--accent-glow);border:1px solid var(--accent);border-radius:999px;vertical-align:middle;
}
.community-avatar{
  width:40px;height:40px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--border);
  flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-weight:700;font-size:14px;color:var(--accent);
}
.community-avatar img{width:100%;height:100%;object-fit:cover;}
.community-post-body{flex:1;min-width:0;}
.community-post-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.community-post-name{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;}
.community-post-time{font-size:11.5px;color:var(--sub);margin-left:auto;}
.community-post-text{font-size:14px;line-height:1.55;margin-top:4px;white-space:pre-wrap;word-break:break-word;}
.community-empty{text-align:center;padding:32px;color:var(--muted);font-size:14px;}
.community-post-edited{font-size:11px;color:var(--sub);font-style:italic;}
.community-post-actions{display:flex;gap:14px;margin-top:8px;}
.community-action-btn{
  background:none;border:none;cursor:pointer;padding:0;
  font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;
  color:var(--muted);transition:color .2s;
}
.community-action-btn:hover{color:var(--accent);}
.community-action-btn.danger:hover{color:#E5484D;}
.community-edit-box{
  width:100%;min-height:60px;resize:vertical;padding:10px 12px;margin-top:4px;
  border-radius:10px;border:1.5px solid var(--accent);
  background:var(--bg2);color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:14px;box-sizing:border-box;outline:none;
}

/* ── COMMUNITY: kebab (⋮) menu for edit/delete on own messages (added) ── */
.community-menu-wrap{position:relative;display:inline-flex;margin-left:auto;flex-shrink:0;}
.community-menu-btn{
  background:none;border:none;cursor:pointer;
  color:var(--muted);font-size:16px;line-height:1;
  padding:2px 6px;border-radius:8px;
  font-family:'DM Sans',sans-serif;
  transition:background .15s,color .15s;
}
.community-menu-btn:hover{background:var(--surface2);color:var(--text);}
.community-menu-popup-overlay{position:fixed;inset:0;z-index:200;background:transparent;}
.community-menu-popup{
  position:absolute;top:calc(100% + 4px);right:0;z-index:201;
  min-width:130px;padding:6px;
  display:flex;flex-direction:column;gap:2px;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  box-shadow:var(--card-shadow);
}
.community-menu-item{
  background:none;border:none;cursor:pointer;text-align:left;
  padding:8px 10px;border-radius:8px;
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;
  color:var(--text);transition:background .15s;
}
.community-menu-item:hover{background:var(--surface2);}
.community-menu-item.danger{color:#E5484D;}
.community-menu-item.danger:hover{background:rgba(229,72,77,0.1);}
/* Admin-only "Copy UID" popup view (added) */
.community-menu-popup.uid-view{min-width:220px;}
.community-uid-label{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:6px 8px 2px;}
.community-uid-badge{
  font-family:'Share Tech Mono',monospace;font-size:12.5px;color:var(--accent);
  background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:8px 10px;margin:2px 6px 6px;word-break:break-all;user-select:all;
}
.community-uid-copy-btn{font-weight:600;}
.community-uid-copy-btn.copied{color:#22C58B;}
.community-admin-badge{
  display:inline-block;padding:1px 8px;margin-left:2px;
  font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;letter-spacing:.03em;
  color:#fff;background:var(--accent);border-radius:999px;vertical-align:middle;
}

/* ── COMMUNITY: reactions + replies (added) ── */
.community-reactions-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px;}
.reaction-chip{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12.5px;padding:3px 9px;border-radius:100px;
  background:var(--surface2);border:1px solid var(--border);color:var(--muted);
}
.reaction-chip.mine{border-color:var(--accent);color:var(--accent);background:var(--accent-glow);}
.reaction-popup-wrap{position:relative;display:inline-block;}
.react-btn{font-size:12.5px !important;}
.reaction-popup-overlay{position:fixed;inset:0;z-index:200;background:transparent;}
.reaction-popup{
  position:absolute;bottom:calc(100% + 8px);left:0;z-index:201;
  display:flex;gap:4px;padding:8px;border-radius:100px;
  background:var(--surface);border:1px solid var(--border);
  box-shadow:var(--card-shadow);
}
.reaction-popup-btn{
  background:none;border:none;cursor:pointer;font-size:20px;
  padding:4px;border-radius:50%;transition:transform .15s,background .15s;
  line-height:1;
}
.reaction-popup-btn:hover{transform:scale(1.25);background:var(--surface2);}
.reaction-popup-btn.active{background:var(--accent-glow);}
.community-replies-section{
  margin-top:12px;padding-left:14px;border-left:2px solid var(--border);
  display:flex;flex-direction:column;gap:12px;
}
.community-reply{display:flex;gap:10px;}
.community-avatar-sm{width:30px;height:30px;font-size:12px;}
.community-reply-composer{margin-top:4px;}

/* ── INNER APP PAGES ── */
.inner-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:24px;padding:32px;
  box-shadow:var(--card-shadow);
}
.inner-card h2{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:1.6rem;letter-spacing:-.5px;
  margin-bottom:8px;
}
.inner-card .subtitle{font-size:14px;color:var(--muted);margin-bottom:24px;}

/* inputs */
.field-label{font-size:12px;font-weight:600;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;display:block;}
.ks-input{
  width:100%;padding:13px 16px;
  border-radius:12px;border:1.5px solid var(--border);
  background:var(--bg2);color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:15px;
  box-sizing:border-box;
  transition:border-color .2s,box-shadow .2s;
  outline:none;
}
.ks-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
.ks-input.err{border-color:#FF5A5A;box-shadow:0 0 0 3px rgba(255,90,90,.15);}
.ks-select{
  width:100%;padding:13px 16px;
  border-radius:12px;border:1.5px solid var(--border);
  background:var(--bg2);color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:15px;
  outline:none;cursor:pointer;
  transition:border-color .2s;
}
.ks-select:focus{border-color:var(--accent);}
.helper-txt{font-size:13px;color:#FF5A5A;margin-top:4px;display:none;}

.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mt{margin-top:14px;}
.mt-sm{margin-top:10px;}

/* result box */
.result-box{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:16px;padding:20px;margin-top:16px;
}
.result-box p{color:var(--muted);font-size:14px;margin-bottom:4px;}
.result-box strong{font-size:1.5rem;font-family:'Syne',sans-serif;font-weight:800;color:var(--accent);}

/* back-row */
.back-row{display:flex;align-items:center;gap:10px;margin-bottom:24px;}
.back-btn{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;padding:8px 14px;
  font-size:13px;font-weight:600;color:var(--muted);
  cursor:pointer;border:none;font-family:'DM Sans',sans-serif;
  transition:color .2s,background .2s;
}
.back-btn:hover{color:var(--text);background:var(--border);}
.app-footer-btns{
  display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;
  padding-top:24px;border-top:1px solid var(--border);
}

/* ── ADMIN DASHBOARD (added) ── */
.admin-wrap{max-width:900px;margin:100px auto 60px;padding:0 24px;}
.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:12px;}
.admin-tab{
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;
  padding:9px 16px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);cursor:pointer;
  transition:all .2s;
}
.admin-tab:hover{color:var(--text);background:var(--surface2);}
.admin-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0A0C14;border-color:transparent;}
.admin-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:var(--card-shadow);margin-bottom:20px;}
.admin-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.admin-card-head h3{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:700;}
.admin-count{font-size:12px;color:var(--muted);background:var(--bg2);border-radius:100px;padding:3px 10px;}
.admin-empty{color:var(--muted);font-size:14px;padding:12px 0;}
.admin-flag-list{display:flex;flex-direction:column;gap:2px;margin-bottom:14px;}
.admin-flag-row{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:14px;padding:12px 6px;border-bottom:1px solid var(--border);}
.admin-flag-row:last-child{border-bottom:none;}
.admin-flag-name{flex:1;font-family:'Share Tech Mono',monospace;font-size:14px;color:var(--text);word-break:break-all;}
.admin-flag-del{padding:6px 10px;font-size:13px;}
.admin-add-row{display:flex;gap:10px;}
.ks-switch{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0;}
.ks-switch input{opacity:0;width:0;height:0;}
.ks-switch-track{position:absolute;inset:0;background:var(--bg2);border:1px solid var(--border);border-radius:100px;cursor:pointer;transition:background .2s;}
.ks-switch-track::before{content:'';position:absolute;width:18px;height:18px;left:2px;top:2px;background:var(--muted);border-radius:50%;transition:transform .2s,background .2s;}
.ks-switch input:checked + .ks-switch-track{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;}
.ks-switch input:checked + .ks-switch-track::before{transform:translateX(18px);background:#0A0C14;}
.admin-ann-item, .admin-inbox-item{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:var(--bg2);}
.admin-ann-item h4{font-family:'Syne',sans-serif;font-size:15px;margin-bottom:4px;}
.admin-ann-item p{font-size:13.5px;color:var(--muted);white-space:pre-wrap;word-break:break-word;}
.admin-ann-meta{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;}
.admin-badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:100px;letter-spacing:.3px;}
.admin-badge.live{background:rgba(34,197,139,.18);color:#22C58B;}
.admin-badge.off{background:rgba(122,131,158,.18);color:var(--muted);}
/* App Features catalog (added) — same row style as custom flags, minus the delete column */
.admin-flag-group{margin-bottom:18px;}
.admin-flag-group .admin-flag-row{grid-template-columns:1fr auto auto;}
.admin-flag-group-title{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;padding-top:8px;}
.admin-flag-group:first-child .admin-flag-group-title{padding-top:0;}
/* Paused tiles/links across the whole app (nav, home, grids) — visual only,
   the real block lives in go()/isPageBlocked so this can't be bypassed. */
.feature-paused{opacity:.4;filter:grayscale(.6);position:relative;}
.feature-paused-tag{
  position:absolute;top:6px;right:6px;z-index:2;
  background:#FF5A5A;color:#fff;font-size:9px;font-weight:700;
  letter-spacing:.4px;text-transform:uppercase;
  padding:2px 7px;border-radius:100px;pointer-events:none;
  font-family:'DM Sans',sans-serif;
}
.admin-inbox-item .admin-ann-meta{margin-top:6px;}
.admin-pin-shell{
  max-width:380px;margin:110px auto 60px;padding:0 24px;text-align:center;
}
.admin-pin-icon{font-size:42px;margin-bottom:8px;}
.admin-pin-dots{display:flex;justify-content:center;gap:12px;margin:22px 0;}
.admin-pin-dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border);background:var(--bg2);transition:all .15s;}
.admin-pin-dot.filled{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px var(--accent-glow);}
.admin-pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto;}
.admin-pin-key{
  padding:16px 0;border-radius:14px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:18px;font-weight:600;
  cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;
}
.admin-pin-key:hover{background:var(--surface2);transform:translateY(-1px);}
.admin-pin-key:active{transform:scale(.94);}
.admin-pin-key.wide{grid-column:span 1;font-size:14px;color:var(--muted);}
.admin-pin-err{color:#FF5A5A;font-size:13px;margin-top:10px;min-height:18px;}

/* ── PUBLIC ANNOUNCEMENT BANNER (added) ── */
.announcement-stack{
  margin-top:64px; /* clears the fixed navbar */
  display:flex;flex-direction:column;gap:2px;
  position:relative;z-index:50;
}
.announcement-bar{
  display:flex;align-items:flex-start;gap:12px;
  padding:12px 20px;
  background:linear-gradient(135deg,rgba(245,166,35,0.14),rgba(232,134,10,0.08));
  border-bottom:1px solid var(--border);
  animation:announceSlideDown .35s ease both;
}
[data-theme="light"] .announcement-bar{background:linear-gradient(135deg,rgba(245,166,35,0.10),rgba(232,134,10,0.05));}
@keyframes announceSlideDown{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.announcement-icon{font-size:17px;line-height:1.4;flex-shrink:0;}
.announcement-body{flex:1;min-width:0;}
.announcement-title{
  font-family:'Syne',sans-serif;font-weight:700;font-size:14px;
  color:var(--text);margin-bottom:2px;
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
}
.announcement-time{font-size:11px;font-weight:500;color:var(--sub);font-family:'DM Sans',sans-serif;}
.announcement-text{
  font-size:13.5px;color:var(--muted);line-height:1.5;
  white-space:pre-wrap;word-break:break-word;
}
.announcement-text.clamped{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.announcement-more{
  background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:600;
  cursor:pointer;padding:2px 0;margin-top:2px;font-family:'DM Sans',sans-serif;
}
.announcement-dismiss{
  background:none;border:none;color:var(--muted);cursor:pointer;
  font-size:15px;line-height:1;padding:4px 6px;border-radius:8px;flex-shrink:0;
  transition:background .15s,color .15s;
}
.announcement-dismiss:hover{background:var(--surface2);color:var(--text);}
.announcement-more-stack-btn{
  align-self:center;font-size:12px;font-weight:600;color:var(--muted);
  background:var(--surface);border:1px solid var(--border);border-radius:100px;
  padding:6px 16px;cursor:pointer;margin:4px auto 2px;font-family:'DM Sans',sans-serif;
}
.announcement-more-stack-btn:hover{color:var(--text);background:var(--surface2);}
@media(max-width:640px){
  .announcement-bar{padding:10px 14px;}
  .announcement-title{font-size:13px;}
  .announcement-text{font-size:12.5px;}
}

/* ── ABOUT MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;}
.modal-box{
  background:var(--surface);border:1px solid var(--border);
  border-radius:24px;padding:32px;
  width:100%;max-width:460px;
  animation:fadeUp .3s ease;
}
.modal-box h3{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;margin-bottom:10px;}
.modal-box p{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:10px;}

/* ── SPECIAL: PASSWORD ── */
.bar-row{display:flex;gap:6px;margin:12px 0 8px;}
.bar-seg{flex:1;height:5px;border-radius:10px;background:var(--surface2);transition:background .4s;}
.pw-criteria{display:flex;flex-direction:column;gap:8px;margin:12px 0;}
.criterion{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);transition:color .3s;}
.criterion.met{color:#4ade80;}
.crit-dot{width:7px;height:7px;border-radius:50%;background:var(--surface2);flex-shrink:0;transition:background .3s,box-shadow .3s;}
.criterion.met .crit-dot{background:#4ade80;box-shadow:0 0 6px rgba(74,222,128,.5);}
.verdict-row{display:flex;align-items:center;justify-content:space-between;min-height:40px;margin:6px 0;}
.verdict-lbl{font-size:1.4rem;font-weight:700;font-family:'Syne',sans-serif;transition:color .3s;}
.verdict-emoji{font-size:1.5rem;}
.tip-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted);margin-top:6px;}
.eye-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:4px;}
.pw-wrap{position:relative;}
.score-chip{display:inline-block;font-size:12px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 12px;color:var(--muted);margin-top:2px;}
.score-num{font-weight:700;}

/* ── DAY FINDER ── */
.day-result-box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:24px;text-align:center;margin:14px 0;}
.day-big{font-size:2.6rem;font-weight:800;font-family:'Syne',sans-serif;color:var(--accent);letter-spacing:-1px;}
.day-date-lbl{font-size:13px;color:var(--muted);margin-bottom:6px;}
.neighbors{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;}
.nbr{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center;}
.nbr-lbl{font-size:11px;color:var(--muted);margin-bottom:4px;letter-spacing:1px;text-transform:uppercase;}
.nbr-day{font-size:1.1rem;font-weight:700;font-family:'Syne',sans-serif;}
.nbr-date{font-size:11px;color:var(--muted);margin-top:3px;}
.iq-box{background:linear-gradient(135deg,rgba(61,82,213,.15),rgba(79,100,232,.08));border:1px solid rgba(61,82,213,.3);border-radius:14px;padding:14px;text-align:center;margin:10px 0;font-size:13px;color:#a89fff;line-height:1.6;}

/* loading */
.day-loading{display:none;flex-direction:column;align-items:center;padding:24px 0;}
.spinner-wrap{position:relative;width:80px;height:80px;margin-bottom:20px;}
.sp-ring{position:absolute;inset:0;border-radius:50%;border:3px solid transparent;}
.sp-ring.r1{border-top-color:var(--accent);animation:spin 1s linear infinite;}
.sp-ring.r2{inset:10px;border-right-color:#FF5A5A;animation:spin 1.5s linear infinite reverse;}
.sp-ring.r3{inset:22px;border-bottom-color:var(--indigo-soft);animation:spin .8s linear infinite;}
.sp-center{position:absolute;inset:35px;background:var(--accent);border-radius:50%;animation:spulse 1s ease-in-out infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes spulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(.8);}}
.load-phrase{font-size:13px;color:var(--accent);text-align:center;min-height:32px;max-width:240px;opacity:0;animation:fadeUp .5s ease forwards;}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.reveal{animation:fadeUp .4s ease both;}

/* ── HEALTH BUTTON STATES ── */
@keyframes btnPulse{0%,100%{box-shadow:0 0 0 0 rgba(245,166,35,0.5);}50%{box-shadow:0 0 0 10px rgba(245,166,35,0);}}
@keyframes btnPulseGreen{0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,0.5);}50%{box-shadow:0 0 0 10px rgba(74,222,128,0);}}
@keyframes tapPulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,0.6);}50%{box-shadow:0 0 0 16px rgba(248,113,113,0);}}
.btn-running{
  background:linear-gradient(135deg,#1a4a1a,#0a2e0a) !important;
  color:#4ade80 !important;
  border:1.5px solid #4ade80 !important;
  animation:btnPulseGreen 1.8s ease-in-out infinite;
}
.btn-paused{
  background:linear-gradient(135deg,#2a2a0a,#1a1a00) !important;
  color:#fbbf24 !important;
  border:1.5px solid #fbbf24 !important;
}
.tap-btn-active{animation:tapPulse 1s ease-in-out infinite;}
.tap-btn-idle{animation:none;opacity:0.5;pointer-events:none;}

/* WHO table */
.who-table{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px;}
.who-table th{font-family:'Syne',sans-serif;font-weight:700;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);}
.who-table td{padding:10px 14px;border-bottom:1px solid var(--border);}
.who-table tr:last-child td{border-bottom:none;}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 10px;border-radius:100px;}
.tag.uw{background:rgba(96,165,250,.15);color:#60a5fa;}
.tag.nm{background:rgba(74,222,128,.15);color:#4ade80;}
.tag.ow{background:rgba(251,191,36,.15);color:#fbbf24;}
.tag.ob{background:rgba(248,113,113,.15);color:#f87171;}

@media(max-width:480px){
  .navbar{padding:0 18px;}
  .hero-cta{flex-direction:column;align-items:center;}
  .inner-card{padding:22px 18px;}
  .grid-3{grid-template-columns:1fr 1fr;}
}

.palette-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px;}
.palette-swatch{
  display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;
  padding:10px 4px;border-radius:14px;border:2px solid transparent;transition:border-color .2s;
}
.palette-swatch.active{border-color:var(--text);}
.palette-swatch .dot{width:36px;height:36px;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.25);}
.palette-swatch .plabel{font-size:11px;color:var(--muted);}

.settings-menu-item{
  display:flex;align-items:center;gap:14px;width:100%;background:var(--surface);
  border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;
  cursor:pointer;text-align:left;font-family:'DM Sans',sans-serif;color:var(--text);
  transition:border-color .2s;
}
.settings-menu-item:hover{border-color:var(--accent);}
.settings-menu-icon{font-size:1.5rem;width:38px;text-align:center;flex-shrink:0;}
.settings-menu-text{flex:1;}
.settings-menu-text strong{display:block;font-size:14.5px;}
.settings-menu-text span{display:block;font-size:12px;color:var(--muted);margin-top:2px;}
.settings-menu-chevron{color:var(--muted);font-size:1.1rem;}
.settings-panel-back{
  display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--accent);
  font-size:14px;font-weight:600;cursor:pointer;margin-bottom:18px;padding:0;font-family:'DM Sans',sans-serif;
}
.settings-panel-title{font-family:Syne,sans-serif;font-weight:800;font-size:1.05rem;margin-bottom:16px;}

.info-box{
  background:var(--bg2);border-left:3px solid var(--accent);border-radius:10px;
  padding:14px 16px;font-size:12.5px;color:var(--muted);line-height:1.7;margin:16px 0;
}
.cycle-form{display:flex;flex-direction:column;gap:14px;margin-bottom:20px;}
.cycle-form label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:6px;}
.cycle-result-box{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;text-align:center;margin-bottom:16px;}
.cycle-phase-tag{display:inline-block;padding:6px 16px;border-radius:20px;background:var(--accent);color:#0A0C14;font-weight:700;font-size:13px;margin-bottom:10px;}
.cycle-day-big{font-family:Syne,sans-serif;font-weight:800;font-size:1.8rem;margin-bottom:4px;}
.cycle-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.cycle-stat{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center;}
.cycle-stat .lbl{font-size:11px;color:var(--muted);margin-bottom:4px;}
.cycle-stat .val{font-family:Rajdhani,sans-serif;font-weight:700;font-size:1.05rem;}

/* ── LIFE IN NUMBERS (added) — animated existence stats app ── */
@keyframes lifestatIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes lifestatHeartbeat{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.18);}
}
.lifestat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px;}
@media(max-width:520px){.lifestat-grid{grid-template-columns:1fr;}}
.lifestat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  padding:18px;display:flex;align-items:center;gap:14px;
  opacity:0;animation:lifestatIn .5s ease forwards;
}
.lifestat-icon{
  width:44px;height:44px;flex-shrink:0;border-radius:12px;
  background:var(--bg2);display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;
}
.lifestat-icon.pulse{animation:lifestatHeartbeat 1s ease-in-out infinite;}
.lifestat-value{
  font-family:Syne,sans-serif;font-weight:800;font-size:1.3rem;color:var(--text);
  line-height:1.15;
}
.lifestat-value .unit{font-family:'DM Sans',sans-serif;font-weight:600;font-size:0.8rem;color:var(--muted);margin-left:3px;}
.lifestat-label{font-size:12px;color:var(--muted);margin-top:2px;}
.lifestat-hero{
  background:linear-gradient(135deg,var(--surface),var(--bg2));
  border:1px solid var(--border);border-radius:20px;padding:26px 22px;
  text-align:center;margin-top:18px;
  opacity:0;animation:lifestatIn .5s ease forwards;
}
.lifestat-hero .big{font-family:Syne,sans-serif;font-weight:800;font-size:2.1rem;color:var(--accent);}
.lifestat-hero .cap{font-size:13px;color:var(--muted);margin-top:6px;}
.lifestat-note{font-size:11.5px;color:var(--sub);text-align:center;margin-top:18px;line-height:1.6;}
.lifestat-live-dot{
  display:inline-block;width:7px;height:7px;border-radius:50%;
  background:#3DCB6C;margin:0 2px;vertical-align:middle;
  animation:lifestatLiveDot 1.6s ease-in-out infinite;
}
@keyframes lifestatLiveDot{
  0%,100%{opacity:1;}
  50%{opacity:.35;}
}

.help-inline-btn{
  width:28px;height:28px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);font-size:13px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;
  margin-left:10px;flex-shrink:0;
}
